name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-cvcm
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run typecheck
      - run: npm run build
      - name: Apply D1 migrations
        run: npx wrangler d1 migrations apply cvcm --remote
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      - name: Deploy Worker with static assets
        run: npx wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      # Bing, Yandex, Naver and the other IndexNow engines crawl changed pages right away. The hashes of what was
      # submitted last time travel in the Actions cache; scripts/indexnow.mjs never fails the deploy.
      - name: Restore IndexNow state
        uses: actions/cache/restore@v4
        continue-on-error: true
        with:
          path: .indexnow
          key: indexnow-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: indexnow-
      - name: Tell search engines which pages changed
        continue-on-error: true
        run: node scripts/indexnow.mjs
      - name: Save IndexNow state
        if: hashFiles('.indexnow/pages.json') != ''
        uses: actions/cache/save@v4
        continue-on-error: true
        with:
          path: .indexnow
          key: indexnow-${{ github.run_id }}-${{ github.run_attempt }}
