<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" role="img" aria-label="Why convert HEIC">
  <rect width="960" height="540" rx="28" fill="#fff7fb"/>
  <text x="48" y="54" fill="#a13f6c" font-size="32" font-weight="800" font-family="system-ui,sans-serif">HEIC is smaller. JPG is compatible.</text>
  <rect x="50" y="110" width="410" height="300" rx="22" fill="#ffffff" stroke="#f2d9e5" stroke-width="3"/>
  <text x="72" y="150" fill="#a13f6c" font-size="22" font-weight="700" font-family="system-ui,sans-serif">Keep HEIC</text>
  <text x="72" y="182" fill="#59364b" font-size="18" font-family="system-ui,sans-serif"><tspan x="72" dy="0">On your phone.</tspan><tspan x="72" dy="22">In iCloud.</tspan><tspan x="72" dy="22">When space matters.</tspan></text>

  <rect x="500" y="110" width="410" height="300" rx="22" fill="#ffe4ee" stroke="#c83f79" stroke-width="3"/>
  <text x="522" y="150" fill="#a13f6c" font-size="22" font-weight="700" font-family="system-ui,sans-serif">Export JPG</text>
  <text x="522" y="182" fill="#59364b" font-size="18" font-family="system-ui,sans-serif"><tspan x="522" dy="0">Windows PCs.</tspan><tspan x="522" dy="22">School forms.</tspan><tspan x="522" dy="22">Chat apps that reject HEIC.</tspan></text>
<text x="48" y="500" fill="#876579" font-size="18" font-family="system-ui,sans-serif">Convert a copy. Keep the original HEIC if you still edit on iPhone.</text>
</svg>
