<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" role="img" aria-label="書き出しを再ドロップ。2回目はきれい。">
  <rect width="960" height="540" rx="28" fill="#fff7fb"/>
  <text x="48" y="54" fill="#a13f6c" font-size="28" font-weight="800" font-family="system-ui,'PingFang SC','Noto Sans SC','Hiragino Sans',sans-serif">書き出しを再ドロップ。2回目はきれい。</text>
  <g font-family="system-ui,'PingFang SC','Noto Sans SC','Hiragino Sans',sans-serif" font-size="20" fill="#59364b">
    <rect x="70" y="130" width="820" height="90" rx="18" fill="#ffe4ee" stroke="#c83f79" stroke-width="3"/>
