<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" role="img" aria-label="100%で1ページ開く">
  <rect width="960" height="540" rx="28" fill="#fff7fb"/>
  <text x="48" y="54" fill="#a13f6c" font-size="32" font-weight="800" font-family="system-ui,'PingFang SC','Noto Sans SC','Hiragino Sans',sans-serif">100%で1ページ開く</text>
  <g font-family="system-ui,'PingFang SC','Noto Sans SC','Hiragino Sans',sans-serif" fill="#59364b" font-size="20">
    <rect x="70" y="130" width="820" height="260" rx="22" fill="#fff" stroke="#f7b6cb" stroke-width="3"/>
    <text x="110" y="200">100%にして本文を1行読む。</text>
    <text x="110" y="250">表の数字が潰れたら2×とPNG。</text>
    <text x="110" y="300">全ページZIPの方が逐次保存より楽。</text>
  </g>
<text x="48" y="500" fill="#876579" font-size="18" font-family="system-ui,'PingFang SC','Noto Sans SC','Hiragino Sans',sans-serif">サムネは良くても実寸は違う。</text>
</svg>
