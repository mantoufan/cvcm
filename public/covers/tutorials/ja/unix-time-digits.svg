  <rect x="70" y="140" width="250" height="200" rx="22" fill="#ffffff" stroke="#f2d9e5" stroke-width="3"/>
  <text x="98" y="192" fill="#a13f6c" font-size="24" font-weight="700" font-family="system-ui,'PingFang SC','Noto Sans SC','Hiragino Sans',sans-serif">10桁</text>
  <text x="98" y="236" fill="#59364b" font-size="18" font-family="system-ui,'PingFang SC','Noto Sans SC','Hiragino Sans',sans-serif">秒</text>

  <rect x="350" y="140" width="250" height="200" rx="22" fill="#ffe4ee" stroke="#c83f79" stroke-width="3"/>
  <text x="378" y="192" fill="#a13f6c" font-size="24" font-weight="700" font-family="system-ui,'PingFang SC','Noto Sans SC','Hiragino Sans',sans-serif">13桁</text>
