<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" role="img" aria-label="ノイズの種類ごとに、低い周波数から高い周波数までエネルギーがどう分布するか。">
  <rect width="960" height="540" rx="28" fill="#fff7fb"/>
  <rect x="70" y="60" width="820" height="420" rx="18" fill="#ffffff" stroke="#f2d9e5" stroke-width="3"/><line x1="170" y1="410" x2="680" y2="410" stroke="#876579" stroke-width="2" stroke-linecap="round"/><line x1="170" y1="90" x2="170" y2="410" stroke="#876579" stroke-width="2" stroke-linecap="round"/><text x="170" y="445" fill="#876579" font-size="20" font-weight="400" text-anchor="start" font-family="system-ui,'PingFang SC','Noto Sans SC','Hiragino Sans',sans-serif">低</text><text x="680" y="445" fill="#876579" font-size="20" font-weight="400" text-anchor="end" font-family="system-ui,'PingFang SC','Noto Sans SC','Hiragino Sans',sans-serif">高</text><text x="425.0" y="445" fill="#876579" font-size="20" font-weight="400" text-anchor="middle" font-family="system-ui,'PingFang SC','Noto Sans SC','Hiragino Sans',sans-serif">周波数 →</text><text x="120" y="260.0" fill="#876579" font-size="20" text-anchor="middle" font-family="system-ui,'PingFang SC','Noto Sans SC','Hiragino Sans',sans-serif" transform="rotate(-90 120 260.0)">エネルギー →</text><line x1="170" y1="170.0" x2="680" y2="170.0" stroke="#a13f6c" stroke-width="6" stroke-linecap="round"/><text x="696" y="168.0" fill="#a13f6c" font-size="24" font-weight="800" text-anchor="start" font-family="system-ui,'PingFang SC','Noto Sans SC','Hiragino Sans',sans-serif">ホワイト</text><text x="696" y="194.0" fill="#a13f6c" font-size="18" font-weight="400" text-anchor="start" font-family="ui-monospace,Menlo,Consolas,monospace">0 dB / octave</text><line x1="170" y1="170.0" x2="680" y2="285.0" stroke="#c83f79" stroke-width="6" stroke-linecap="round"/><text x="696" y="283.0" fill="#c83f79" font-size="24" font-weight="800" text-anchor="start" font-family="system-ui,'PingFang SC','Noto Sans SC','Hiragino Sans',sans-serif">ピンク</text><text x="696" y="309.0" fill="#c83f79" font-size="18" font-weight="400" text-anchor="start" font-family="ui-monospace,Menlo,Consolas,monospace">−3 dB / octave</text><line x1="170" y1="170.0" x2="680" y2="400.0" stroke="#876579" stroke-width="6" stroke-linecap="round"/><text x="696" y="398.0" fill="#876579" font-size="24" font-weight="800" text-anchor="start" font-family="system-ui,'PingFang SC','Noto Sans SC','Hiragino Sans',sans-serif">ブラウン</text><text x="696" y="424.0" fill="#876579" font-size="18" font-weight="400" text-anchor="start" font-family="ui-monospace,Menlo,Consolas,monospace">−6 dB / octave</text>
</svg>
