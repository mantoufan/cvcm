<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" role="img" aria-label="利益率の計算方法">
  <rect width="1280" height="720" rx="28" fill="#fff7fb"/>
  <text x="48" y="54" fill="#a13f6c" font-size="26" font-weight="800" font-family="system-ui,'PingFang SC','Noto Sans SC','Hiragino Sans',sans-serif">利益率の計算方法</text>
  <rect x="80" y="150" width="340" height="220" rx="22" fill="#ffffff" stroke="#f2d9e5" stroke-width="3"/>
  <text x="104" y="202" fill="#a13f6c" font-size="22" font-weight="700" font-family="system-ui,'PingFang SC','Noto Sans SC','Hiragino Sans',sans-serif">原価 50</text>
  <text x="104" y="246" fill="#59364b" font-size="16" font-family="system-ui,'PingFang SC','Noto Sans SC','Hiragino Sans',sans-serif">利益率 37.50%</text>

  <rect x="460" y="150" width="340" height="220" rx="22" fill="#ffe4ee" stroke="#c83f79" stroke-width="3"/>
  <text x="484" y="202" fill="#a13f6c" font-size="22" font-weight="700" font-family="system-ui,'PingFang SC','Noto Sans SC','Hiragino Sans',sans-serif">売価 80</text>
  <text x="484" y="246" fill="#59364b" font-size="16" font-family="system-ui,'PingFang SC','Noto Sans SC','Hiragino Sans',sans-serif">マークアップ 60.00%</text>

  <rect x="840" y="150" width="360" height="220" rx="22" fill="#ffffff" stroke="#f2d9e5" stroke-width="3"/>
  <text x="864" y="202" fill="#a13f6c" font-size="22" font-weight="700" font-family="system-ui,'PingFang SC','Noto Sans SC','Hiragino Sans',sans-serif">30.00</text>
  <text x="864" y="246" fill="#59364b" font-size="16" font-family="system-ui,'PingFang SC','Noto Sans SC','Hiragino Sans',sans-serif">利益率は売価で割る。マークアップは原価で割る。</text>
<text x="80" y="470" fill="#876579" font-size="18" font-family="system-ui,'PingFang SC','Noto Sans SC','Hiragino Sans',sans-serif">利益率は売価で割る。マークアップは原価で割る。</text>
</svg>
