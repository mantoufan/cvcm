<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" role="img" aria-label="四辺を見る">
  <rect width="960" height="540" rx="28" fill="#fff7fb"/>
  <text x="48" y="54" fill="#a13f6c" font-size="32" font-weight="800" font-family="system-ui,'PingFang SC','Noto Sans SC','Hiragino Sans',sans-serif">四辺を見る</text>
  <rect x="310" y="90" width="340" height="300" rx="16" fill="#ffe4ee" stroke="#c83f79" stroke-width="6"/>
  <circle cx="480" cy="185" r="32" fill="#c83f79"/>
  <ellipse cx="480" cy="290" rx="70" ry="78" fill="#c83f79"/>
  <g font-family="system-ui,'PingFang SC','Noto Sans SC','Hiragino Sans',sans-serif" fill="#a13f6c" font-size="20" font-weight="700">
    <text x="70" y="140">頭上</text>
    <text x="70" y="170" fill="#59364b" font-size="16" font-weight="400">頭を切らない。</text>
    <text x="680" y="180">視線の先</text>
    <text x="680" y="210" fill="#59364b" font-size="16" font-weight="400">見ている方向に余白。</text>
    <text x="70" y="360">関節</text>
    <text x="70" y="390" fill="#59364b" font-size="16" font-weight="400">手首や膝で切らない。</text>
    <text x="680" y="360">端</text>
    <text x="680" y="390" fill="#59364b" font-size="16" font-weight="400">端に物体を半分残さない。</text>
  </g>
<text x="48" y="500" fill="#876579" font-size="18" font-family="system-ui,'PingFang SC','Noto Sans SC','Hiragino Sans',sans-serif">書き出して100%で見る。プレビューは小さい。</text>
</svg>
