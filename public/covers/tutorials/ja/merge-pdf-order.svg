<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" role="img" aria-label="リスト順がページ順">
  <rect width="960" height="540" rx="28" fill="#fff7fb"/>
  <text x="48" y="54" fill="#a13f6c" font-size="32" font-weight="800" font-family="system-ui,'PingFang SC','Noto Sans SC','Hiragino Sans',sans-serif">リスト順がページ順</text>
  <g font-family="system-ui,'PingFang SC','Noto Sans SC','Hiragino Sans',sans-serif" font-size="22" fill="#59364b">
    <rect x="70" y="120" width="360" height="80" rx="16" fill="#ffe4ee" stroke="#c83f79" stroke-width="3"/>
    <text x="100" y="170">1  Cover.pdf</text>
    <rect x="70" y="220" width="360" height="80" rx="16" fill="#fff" stroke="#f2d9e5" stroke-width="3"/>
    <text x="100" y="270">2  Contract.pdf</text>
    <rect x="70" y="320" width="360" height="80" rx="16" fill="#fff" stroke="#f2d9e5" stroke-width="3"/>
    <text x="100" y="370">3  Appendix.pdf</text>
    <text x="500" y="200" fill="#a13f6c" font-size="24" font-weight="700">ドラッグで並べ替え</text>
    <text x="500" y="250" font-size="18">先頭が1ページ目。</text>
    <text x="500" y="295" font-size="18">元の空白ページは残る。</text>
    <text x="500" y="340" font-size="18">書き出し後にページ数を確認。</text>
  </g>
<text x="48" y="500" fill="#876579" font-size="18" font-family="system-ui,'PingFang SC','Noto Sans SC','Hiragino Sans',sans-serif">1ページ目が違うのはリストの順。</text>
</svg>
