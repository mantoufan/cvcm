<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" role="img" aria-label="結合結果を確認">
  <rect width="960" height="540" rx="28" fill="#fff7fb"/>
  <text x="48" y="54" fill="#a13f6c" font-size="32" font-weight="800" font-family="system-ui,'PingFang SC','Noto Sans SC','Hiragino Sans',sans-serif">結合結果を確認</text>
  <g font-family="system-ui,'PingFang SC','Noto Sans SC','Hiragino Sans',sans-serif">
    <rect x="80" y="130" width="800" height="280" rx="24" fill="#fff" stroke="#f7b6cb" stroke-width="3"/>
    <text x="120" y="200" fill="#a13f6c" font-size="26" font-weight="700">ダウンロードを開く</text>
    <text x="120" y="255" fill="#59364b" font-size="20">3+2+4は9ページ。</text>
    <text x="120" y="305" fill="#59364b" font-size="20">各元ファイルの先頭を見る。</text>
    <text x="120" y="355" fill="#59364b" font-size="20">欠けていれば暗号化か未追加。</text>
  </g>
<text x="48" y="500" fill="#876579" font-size="18" font-family="system-ui,'PingFang SC','Noto Sans SC','Hiragino Sans',sans-serif">一度開いてから送る。</text>
</svg>
