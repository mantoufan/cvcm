<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" role="img" aria-label="HEICをJPGに変換">
  <rect width="1280" height="720" rx="28" fill="#fff7fb"/>
  <text x="48" y="54" fill="#a13f6c" font-size="32" font-weight="800" font-family="system-ui,'PingFang SC','Noto Sans SC','Hiragino Sans',sans-serif">HEICをJPGに変換</text>
  <g font-family="system-ui,'PingFang SC','Noto Sans SC','Hiragino Sans',sans-serif">
    <rect x="90" y="160" width="320" height="360" rx="28" fill="#ffe4ee" stroke="#c83f79" stroke-width="4"/>
    <text x="130" y="240" fill="#a13f6c" font-size="26" font-weight="700">IMG_0123.HEIC</text>
    <text x="130" y="300" fill="#59364b" font-size="20">iPhoneの標準</text>
    <text x="130" y="350" fill="#876579" font-size="18">Windows / WeChat</text>
    <text x="130" y="390" fill="#876579" font-size="18">開けないことが多い</text>
    <path d="M460 330 h90" stroke="#c83f79" stroke-width="10" stroke-linecap="round"/>
    <polygon points="550,310 610,330 550,350" fill="#c83f79"/>
    <rect x="650" y="160" width="480" height="360" rx="28" fill="#fff" stroke="#f7b6cb" stroke-width="4"/>
    <text x="700" y="240" fill="#a13f6c" font-size="26" font-weight="700">IMG_0123.jpg</text>
    <text x="700" y="300" fill="#59364b" font-size="20">画素はそのまま、互換性</text>
    <text x="700" y="360" fill="#59364b" font-size="20">送る前にPCで開く</text>
  </g>
<text x="90" y="640" fill="#876579" font-size="18" font-family="system-ui,'PingFang SC','Noto Sans SC','Hiragino Sans',sans-serif">SafariとChromeはHEIC可。WindowsのFirefoxは不可が多い。</text>
</svg>
