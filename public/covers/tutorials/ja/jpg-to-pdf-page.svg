<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" role="img" aria-label="A4か写真に合わせるか">
  <rect width="960" height="540" rx="28" fill="#fff7fb"/>
  <text x="48" y="54" fill="#a13f6c" font-size="32" font-weight="800" font-family="system-ui,'PingFang SC','Noto Sans SC','Hiragino Sans',sans-serif">A4か写真に合わせるか</text>
  <rect x="60" y="110" width="400" height="310" rx="22" fill="#ffe4ee" stroke="#c83f79" stroke-width="3"/>
  <text x="82" y="150" fill="#a13f6c" font-size="22" font-weight="700" font-family="system-ui,'PingFang SC','Noto Sans SC','Hiragino Sans',sans-serif">A4 / Letter</text>
  <text x="82" y="182" fill="#59364b" font-size="18" font-family="system-ui,'PingFang SC','Noto Sans SC','Hiragino Sans',sans-serif"><tspan x="82" dy="0">提出とプリンタ。</tspan><tspan x="82" dy="22">余白がつく。</tspan><tspan x="82" dy="22">宿題向き。</tspan></text>

  <rect x="500" y="110" width="400" height="310" rx="22" fill="#ffffff" stroke="#f2d9e5" stroke-width="3"/>
  <text x="522" y="150" fill="#a13f6c" font-size="22" font-weight="700" font-family="system-ui,'PingFang SC','Noto Sans SC','Hiragino Sans',sans-serif">写真に合わせる</text>
  <text x="522" y="182" fill="#59364b" font-size="18" font-family="system-ui,'PingFang SC','Noto Sans SC','Hiragino Sans',sans-serif"><tspan x="522" dy="0">1枚がページいっぱい。</tspan><tspan x="522" dy="22">作品集向き。</tspan><tspan x="522" dy="22">事務プリンタには不向き。</tspan></text>
<text x="48" y="500" fill="#876579" font-size="18" font-family="system-ui,'PingFang SC','Noto Sans SC','Hiragino Sans',sans-serif">端が切れたらA4仕事にフィットを選んだ。</text>
</svg>
