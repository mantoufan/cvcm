<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" role="img" aria-label="− は削除、+ は追加">
  <rect width="960" height="540" rx="28" fill="#fff7fb"/>
  <text x="48" y="54" fill="#a13f6c" font-size="22" font-weight="800" font-family="system-ui,'PingFang SC','Noto Sans SC','Hiragino Sans',sans-serif">二つの文章を比べる方法</text>
  <rect x="70" y="140" width="820" height="200" rx="22" fill="#ffe4ee" stroke="#c83f79" stroke-width="3"/>
  <text x="94" y="192" fill="#a13f6c" font-size="22" font-weight="700" font-family="system-ui,'PingFang SC','Noto Sans SC','Hiragino Sans',sans-serif">− は削除、+ は追加</text>
  <text x="94" y="236" fill="#59364b" font-size="16" font-family="system-ui,'PingFang SC','Noto Sans SC','Hiragino Sans',sans-serif">「余分な空白を無視」でインデント変更を隠す。</text>

