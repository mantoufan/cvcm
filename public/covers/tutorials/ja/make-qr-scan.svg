<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" role="img" aria-label="印刷前に読む">
  <rect width="960" height="540" rx="28" fill="#fff7fb"/>
  <text x="48" y="54" fill="#a13f6c" font-size="32" font-weight="800" font-family="system-ui,'PingFang SC','Noto Sans SC','Hiragino Sans',sans-serif">印刷前に読む</text>
  <rect x="80" y="120" width="220" height="300" rx="36" fill="#fff" stroke="#c83f79" stroke-width="6"/>
  <rect x="110" y="160" width="160" height="160" rx="12" fill="#ffe4ee"/>
  <rect x="150" y="360" width="80" height="10" rx="5" fill="#f7b6cb"/>
  <text x="360" y="200" fill="#a13f6c" font-size="24" font-weight="700" font-family="system-ui,'PingFang SC','Noto Sans SC','Hiragino Sans',sans-serif">カメラ</text>
  <text x="360" y="250" fill="#59364b" font-size="20" font-family="system-ui,'PingFang SC','Noto Sans SC','Hiragino Sans',sans-serif">20–30cm離す。</text>
  <text x="360" y="300" fill="#59364b" font-size="20" font-family="system-ui,'PingFang SC','Noto Sans SC','Hiragino Sans',sans-serif">ページが開くこと。検索は失敗。</text>
  <text x="360" y="350" fill="#59364b" font-size="20" font-family="system-ui,'PingFang SC','Noto Sans SC','Hiragino Sans',sans-serif">余白（クワイエットゾーン）を残す。</text>
  <text x="360" y="400" fill="#59364b" font-size="20" font-family="system-ui,'PingFang SC','Noto Sans SC','Hiragino Sans',sans-serif">一辺2cm以上。縦横比は維持。</text>
<text x="48" y="500" fill="#876579" font-size="18" font-family="system-ui,'PingFang SC','Noto Sans SC','Hiragino Sans',sans-serif">台所で失敗するコードは玄関でも失敗します。</text>
</svg>
