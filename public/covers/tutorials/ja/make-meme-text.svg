<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" role="img" aria-label="上は振り、下は落ち。">
  <rect width="960" height="540" rx="28" fill="#fff7fb"/>
  <text x="48" y="54" fill="#a13f6c" font-size="28" font-weight="800" font-family="system-ui,'PingFang SC','Noto Sans SC','Hiragino Sans',sans-serif">上は振り、下は落ち。</text>
  <g font-family="system-ui,'PingFang SC','Noto Sans SC','Hiragino Sans',sans-serif">
    <text x="80" y="200" fill="#a13f6c" font-size="28" font-weight="700">上の行</text>
    <text x="80" y="280" fill="#59364b" font-size="28" font-weight="700">下の行</text>
  </g>
<text x="48" y="500" fill="#876579" font-size="18" font-family="system-ui,'PingFang SC','Noto Sans SC','Hiragino Sans',sans-serif">短く。縁。顔を隠さない。</text>
</svg>
