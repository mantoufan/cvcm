<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" role="img" aria-label="位置情報とEXIFを除く">
  <rect width="1280" height="720" rx="28" fill="#fff7fb"/>
  <text x="48" y="54" fill="#a13f6c" font-size="32" font-weight="800" font-family="system-ui,'PingFang SC','Noto Sans SC','Hiragino Sans',sans-serif">位置情報とEXIFを除く</text>
  <g font-family="system-ui,'PingFang SC','Noto Sans SC','Hiragino Sans',sans-serif">
    <rect x="90" y="160" width="420" height="360" rx="24" fill="#ffe4ee" stroke="#c83f79" stroke-width="4"/>
    <text x="130" y="280" fill="#a13f6c" font-size="26" font-weight="700">画素 + GPS</text>
    <path d="M560 330 h80" stroke="#c83f79" stroke-width="10" stroke-linecap="round"/>
    <polygon points="640,310 700,330 640,350" fill="#c83f79"/>
    <rect x="730" y="160" width="460" height="360" rx="24" fill="#fff" stroke="#c83f79" stroke-width="4"/>
    <text x="770" y="280" fill="#a13f6c" font-size="26" font-weight="700">画素だけ</text>
  </g>
<text x="90" y="640" fill="#876579" font-size="18" font-family="system-ui,'PingFang SC','Noto Sans SC','Hiragino Sans',sans-serif">コピーを書き出す。ピンが要る原版は残す。</text>
</svg>
