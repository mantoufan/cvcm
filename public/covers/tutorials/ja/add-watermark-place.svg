<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" role="img" aria-label="隅かタイルか">
  <rect width="960" height="540" rx="28" fill="#fff7fb"/>
  <text x="48" y="54" fill="#a13f6c" font-size="28" font-weight="800" font-family="system-ui,'PingFang SC','Noto Sans SC','Hiragino Sans',sans-serif">隅かタイルか</text>
  <rect x="50" y="110" width="410" height="300" rx="22" fill="#ffffff" stroke="#f2d9e5" stroke-width="3"/>
  <text x="72" y="150" fill="#a13f6c" font-size="22" font-weight="700" font-family="system-ui,'PingFang SC','Noto Sans SC','Hiragino Sans',sans-serif">隅の1つ</text>
  <text x="72" y="182" fill="#59364b" font-size="18" font-family="system-ui,'PingFang SC','Noto Sans SC','Hiragino Sans',sans-serif"><tspan x="72" dy="0">斜めタイル</tspan></text>

  <rect x="500" y="110" width="410" height="300" rx="22" fill="#ffe4ee" stroke="#c83f79" stroke-width="3"/>
  <text x="522" y="150" fill="#a13f6c" font-size="22" font-weight="700" font-family="system-ui,'PingFang SC','Noto Sans SC','Hiragino Sans',sans-serif">斜めタイル</text>
  <text x="522" y="182" fill="#59364b" font-size="18" font-family="system-ui,'PingFang SC','Noto Sans SC','Hiragino Sans',sans-serif"><tspan x="522" dy="0">隅の1つ</tspan></text>
<text x="48" y="500" fill="#876579" font-size="18" font-family="system-ui,'PingFang SC','Noto Sans SC','Hiragino Sans',sans-serif">読めない印は無用。商品を隠す印も無用。</text>
</svg>
