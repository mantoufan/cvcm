<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" role="img" aria-label="Pick WebP to keep alpha. JPG fills it in.">
  <rect width="960" height="540" rx="28" fill="#fff7fb"/>
  <text x="48" y="54" fill="#a13f6c" font-size="24" font-weight="800" font-family="system-ui,'PingFang SC','Noto Sans SC','Hiragino Sans',sans-serif">Pick WebP to keep alpha. JPG fills it in.</text>
  <rect x="70" y="130" width="820" height="220" rx="22" fill="#ffe4ee" stroke="#c83f79" stroke-width="3"/>
  <text x="98" y="178" fill="#a13f6c" font-size="24" font-weight="700" font-family="system-ui,'PingFang SC','Noto Sans SC','Hiragino Sans',sans-serif">WebP ≠ JPG</text>
  <text x="98" y="218" fill="#59364b" font-size="18" font-family="system-ui,'PingFang SC','Noto Sans SC','Hiragino Sans',sans-serif">Pick WebP to keep alpha. JPG fills it in.</text>
<text x="48" y="500" fill="#876579" font-size="18" font-family="system-ui,'PingFang SC','Noto Sans SC','Hiragino Sans',sans-serif">WebP can keep a clear background. JPG cannot. Old forms may still want PNG.</text>
</svg>
