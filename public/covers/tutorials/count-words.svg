<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" role="img" aria-label="How to count words and characters">
  <rect width="1280" height="720" rx="28" fill="#fff7fb"/>
  <text x="48" y="54" fill="#a13f6c" font-size="32" font-weight="800" font-family="system-ui,'PingFang SC','Noto Sans SC','Hiragino Sans',sans-serif">How to count words and characters</text>
  <g font-family="system-ui,'PingFang SC','Noto Sans SC','Hiragino Sans',sans-serif">
    <rect x="80" y="160" width="340" height="300" rx="22" fill="#ffe4ee" stroke="#c83f79" stroke-width="3"/>
    <text x="110" y="280" fill="#a13f6c" font-size="28" font-weight="700">Words</text>
    <rect x="460" y="160" width="340" height="300" rx="22" fill="#fff" stroke="#f7b6cb" stroke-width="3"/>
    <text x="490" y="280" fill="#a13f6c" font-size="28" font-weight="700">Characters</text>
    <rect x="840" y="160" width="360" height="300" rx="22" fill="#fff" stroke="#f7b6cb" stroke-width="3"/>
    <text x="870" y="280" fill="#a13f6c" font-size="28" font-weight="700">No spaces</text>
  </g>
<text x="80" y="620" fill="#876579" font-size="18" font-family="system-ui,'PingFang SC','Noto Sans SC','Hiragino Sans',sans-serif">Three jobs, three numbers. Chinese homework uses no-spaces.</text>
</svg>
