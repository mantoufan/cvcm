<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" role="img" aria-label="PDF page size">
  <rect width="960" height="540" rx="28" fill="#fff7fb"/>
  <text x="48" y="54" fill="#a13f6c" font-size="32" font-weight="800" font-family="system-ui,sans-serif">A4 vs fit-to-photo</text>
  <rect x="60" y="110" width="400" height="310" rx="22" fill="#ffe4ee" stroke="#c83f79" stroke-width="3"/>
  <text x="82" y="150" fill="#a13f6c" font-size="22" font-weight="700" font-family="system-ui,sans-serif">A4 / Letter</text>
  <text x="82" y="182" fill="#59364b" font-size="18" font-family="system-ui,sans-serif"><tspan x="82" dy="0">Forms and printers.</tspan><tspan x="82" dy="22">Photos get margins.</tspan><tspan x="82" dy="22">Use for homework.</tspan></text>

  <rect x="500" y="110" width="400" height="310" rx="22" fill="#ffffff" stroke="#f2d9e5" stroke-width="3"/>
  <text x="522" y="150" fill="#a13f6c" font-size="22" font-weight="700" font-family="system-ui,sans-serif">Fit to photo</text>
  <text x="522" y="182" fill="#59364b" font-size="18" font-family="system-ui,sans-serif"><tspan x="522" dy="0">One image fills the page.</tspan><tspan x="522" dy="22">Better for a lookbook.</tspan><tspan x="522" dy="22">Worse for office printers.</tspan></text>
<text x="48" y="500" fill="#876579" font-size="18" font-family="system-ui,sans-serif">If a printer crops the edge, you picked fit-to-photo on an A4 job.</text>
</svg>
