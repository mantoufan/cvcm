<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" role="img" aria-label="樣本用平方和除以 n − 1，母體除以 n，再開根號。">
  <rect width="960" height="540" rx="28" fill="#fff7fb"/>
  <rect x="60" y="60" width="400" height="420" rx="22" fill="#ffe4ee" stroke="#c83f79" stroke-width="3"/><text x="260" y="115" fill="#a13f6c" font-size="30" font-weight="800" text-anchor="middle" font-family="system-ui,'PingFang SC','Noto Sans SC','Hiragino Sans',sans-serif">樣本</text><text x="260" y="160" fill="#876579" font-size="26" font-weight="700" text-anchor="middle" font-family="'Cambria Math','STIX Two Math','Noto Sans Math','Apple Symbols',system-ui,sans-serif">÷ n − 1</text><text x="260" y="250" fill="#59364b" font-size="34" font-weight="800" text-anchor="middle" font-family="ui-monospace,Menlo,Consolas,monospace">32 ÷ 7 = 4.571</text><text x="260" y="285" fill="#876579" font-size="20" font-weight="700" text-anchor="middle" font-family="system-ui,'PingFang SC','Noto Sans SC','Hiragino Sans',sans-serif">變異數 s²</text><text x="260" y="380" fill="#a13f6c" font-size="34" font-weight="800" text-anchor="middle" font-family="ui-monospace,Menlo,Consolas,monospace">√4.571 = 2.138</text><text x="260" y="415" fill="#876579" font-size="20" font-weight="700" text-anchor="middle" font-family="system-ui,'PingFang SC','Noto Sans SC','Hiragino Sans',sans-serif">標準差 s</text><rect x="500" y="60" width="400" height="420" rx="22" fill="#ffffff" stroke="#f2d9e5" stroke-width="3"/><text x="700" y="115" fill="#a13f6c" font-size="30" font-weight="800" text-anchor="middle" font-family="system-ui,'PingFang SC','Noto Sans SC','Hiragino Sans',sans-serif">母體</text><text x="700" y="160" fill="#876579" font-size="26" font-weight="700" text-anchor="middle" font-family="'Cambria Math','STIX Two Math','Noto Sans Math','Apple Symbols',system-ui,sans-serif">÷ n</text><text x="700" y="250" fill="#59364b" font-size="34" font-weight="800" text-anchor="middle" font-family="ui-monospace,Menlo,Consolas,monospace">32 ÷ 8 = 4</text><text x="700" y="285" fill="#876579" font-size="20" font-weight="700" text-anchor="middle" font-family="system-ui,'PingFang SC','Noto Sans SC','Hiragino Sans',sans-serif">變異數 σ²</text><text x="700" y="380" fill="#a13f6c" font-size="34" font-weight="800" text-anchor="middle" font-family="ui-monospace,Menlo,Consolas,monospace">√4 = 2</text><text x="700" y="415" fill="#876579" font-size="20" font-weight="700" text-anchor="middle" font-family="system-ui,'PingFang SC','Noto Sans SC','Hiragino Sans',sans-serif">標準差 σ</text>
</svg>
