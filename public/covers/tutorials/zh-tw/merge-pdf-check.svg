<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" role="img" aria-label="核對合併結果">
  <rect width="960" height="540" rx="28" fill="#fff7fb"/>
  <text x="48" y="54" fill="#a13f6c" font-size="32" font-weight="800" font-family="system-ui,'PingFang SC','Noto Sans SC','Hiragino Sans',sans-serif">核對合併結果</text>
  <g font-family="system-ui,'PingFang SC','Noto Sans SC','Hiragino Sans',sans-serif">
    <rect x="80" y="130" width="800" height="280" rx="24" fill="#fff" stroke="#f7b6cb" stroke-width="3"/>
    <text x="120" y="200" fill="#a13f6c" font-size="26" font-weight="700">打開下載的檔</text>
    <text x="120" y="255" fill="#59364b" font-size="20">3 + 2 + 4 頁應該是 9 頁。</text>
    <text x="120" y="305" fill="#59364b" font-size="20">每份原稿的第一頁掃一眼。</text>
    <text x="120" y="355" fill="#59364b" font-size="20">少了一份，多半是加密或沒加進去。</text>
  </g>
<text x="48" y="500" fill="#876579" font-size="18" font-family="system-ui,'PingFang SC','Noto Sans SC','Hiragino Sans',sans-serif">打開過一次再寄出。</text>
</svg>
