  <text x="480" y="110" fill="#a13f6c" font-size="28" font-weight="800" text-anchor="middle" font-family="system-ui,'PingFang SC','Noto Sans SC','Hiragino Sans',sans-serif">睡眠定時 30 分鐘</text><line x1="120" y1="380" x2="880" y2="380" stroke="#876579" stroke-width="2" stroke-linecap="round"/><path d="M120 380 L150 170 L720 170 L840 380 Z" fill="#ffe4ee" stroke="#c83f79" stroke-width="5" stroke-linejoin="round"/><text x="420.0" y="240" fill="#a13f6c" font-size="26" font-weight="700" text-anchor="middle" font-family="system-ui,'PingFang SC','Noto Sans SC','Hiragino Sans',sans-serif">完整音量</text><line x1="720" y1="140" x2="720" y2="400" stroke="#876579" stroke-width="2" stroke-linecap="round"/><line x1="840" y1="140" x2="840" y2="400" stroke="#876579" stroke-width="2" stroke-linecap="round"/><text x="780.0" y="130" fill="#c83f79" font-size="22" font-weight="800" text-anchor="middle" font-family="system-ui,'PingFang SC','Noto Sans SC','Hiragino Sans',sans-serif">淡出 30 秒</text><text x="120" y="430" fill="#876579" font-size="22" font-weight="400" text-anchor="middle" font-family="ui-monospace,Menlo,Consolas,monospace">0:00</text><text x="720" y="430" fill="#876579" font-size="22" font-weight="400" text-anchor="middle" font-family="ui-monospace,Menlo,Consolas,monospace">29:30</text><text x="840" y="430" fill="#876579" font-size="22" font-weight="400" text-anchor="middle" font-family="ui-monospace,Menlo,Consolas,monospace">30:00</text><text x="850" y="366" fill="#876579" font-size="20" font-weight="700" text-anchor="start" font-family="system-ui,'PingFang SC','Noto Sans SC','Hiragino Sans',sans-serif">停止</text>
