<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" role="img" aria-label="照片檔 = 像素 + 定位">
  <rect width="960" height="540" rx="28" fill="#fff7fb"/>
  <text x="48" y="54" fill="#a13f6c" font-size="28" font-weight="800" font-family="system-ui,'PingFang SC','Noto Sans SC','Hiragino Sans',sans-serif">照片檔 = 像素 + 定位</text>
  <g font-family="system-ui,'PingFang SC','Noto Sans SC','Hiragino Sans',sans-serif">
    <text x="80" y="220" fill="#59364b" font-size="24">像素 + 定位</text>
    <text x="80" y="300" fill="#c83f79" font-size="32" font-weight="800">→ 只剩像素</text>
  </g>
<text x="48" y="500" fill="#876579" font-size="18" font-family="system-ui,'PingFang SC','Noto Sans SC','Hiragino Sans',sans-serif">匯出一份。自己還要釘就留原圖。</text>
</svg>
