<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" role="img" aria-label="對照真實頁面看體積">
  <rect width="960" height="540" rx="28" fill="#fff7fb"/>
  <text x="48" y="54" fill="#a13f6c" font-size="28" font-weight="800" font-family="system-ui,'PingFang SC','Noto Sans SC','Hiragino Sans',sans-serif">對照真實頁面看體積</text>
  <g font-family="system-ui,'PingFang SC','Noto Sans SC','Hiragino Sans',sans-serif">
    <rect x="70" y="130" width="380" height="260" rx="20" fill="#fff" stroke="#f2d9e5" stroke-width="3"/>
    <text x="100" y="190" fill="#876579" font-size="18">壓得更狠</text>
    <text x="100" y="250" fill="#a13f6c" font-size="40" font-weight="700">2.1 MB</text>
    <text x="100" y="310" fill="#59364b" font-size="18">字還行 · 照片糊</text>
    <rect x="510" y="130" width="380" height="260" rx="20" fill="#ffe4ee" stroke="#c83f79" stroke-width="3"/>
    <text x="540" y="190" fill="#876579" font-size="18">壓得輕一點</text>
    <text x="540" y="250" fill="#a13f6c" font-size="40" font-weight="700">7.8 MB</text>
    <text x="540" y="310" fill="#59364b" font-size="18">照片仍然清楚</text>
  </g>
<text x="48" y="500" fill="#876579" font-size="18" font-family="system-ui,'PingFang SC','Noto Sans SC','Hiragino Sans',sans-serif">選還能塞進上限的最大檔。</text>
</svg>
