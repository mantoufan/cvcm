<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" role="img" aria-label="加號和斜線">
  <rect width="960" height="540" rx="28" fill="#fff7fb"/>
  <text x="48" y="54" fill="#a13f6c" font-size="22" font-weight="800" font-family="system-ui,'PingFang SC','Noto Sans SC','Hiragino Sans',sans-serif">加號和斜線</text>
  <rect x="70" y="140" width="390" height="200" rx="22" fill="#ffe4ee" stroke="#c83f79" stroke-width="3"/>
  <text x="98" y="192" fill="#a13f6c" font-size="24" font-weight="700" font-family="system-ui,'PingFang SC','Noto Sans SC','Hiragino Sans',sans-serif">+ /</text>
  <text x="98" y="236" fill="#59364b" font-size="18" font-family="system-ui,'PingFang SC','Noto Sans SC','Hiragino Sans',sans-serif">加號和斜線</text>

  <rect x="490" y="140" width="400" height="200" rx="22" fill="#ffffff" stroke="#f2d9e5" stroke-width="3"/>
  <text x="518" y="192" fill="#a13f6c" font-size="24" font-weight="700" font-family="system-ui,'PingFang SC','Noto Sans SC','Hiragino Sans',sans-serif">- _</text>
  <text x="518" y="236" fill="#59364b" font-size="18" font-family="system-ui,'PingFang SC','Noto Sans SC','Hiragino Sans',sans-serif">減號和底線</text>
<text x="48" y="500" fill="#876579" font-size="18" font-family="system-ui,'PingFang SC','Noto Sans SC','Hiragino Sans',sans-serif">這一頁要標準 Base64。圖片或 PDF 會失敗。</text>
</svg>
