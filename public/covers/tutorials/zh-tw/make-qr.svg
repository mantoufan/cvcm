<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" role="img" aria-label="怎麼產生 QR Code">
  <rect width="1280" height="720" rx="28" fill="#fff7fb"/>
  <text x="48" y="54" fill="#a13f6c" font-size="32" font-weight="800" font-family="system-ui,'PingFang SC','Noto Sans SC','Hiragino Sans',sans-serif">怎麼產生 QR Code</text>
  <rect x="80" y="120" width="360" height="360" rx="28" fill="#fff" stroke="#c83f79" stroke-width="8"/>
  <rect x="120" y="160" width="80" height="80" fill="#59364b"/>
  <rect x="320" y="160" width="80" height="80" fill="#59364b"/>
  <rect x="120" y="360" width="80" height="80" fill="#59364b"/>
  <rect x="220" y="250" width="40" height="40" fill="#c83f79"/>
  <rect x="280" y="310" width="28" height="28" fill="#59364b"/>
  <rect x="180" y="310" width="20" height="20" fill="#59364b"/>
  <path d="M520 280 h80" stroke="#c83f79" stroke-width="10" stroke-linecap="round"/>
  <polygon points="600,260 660,280 600,300" fill="#c83f79"/>
  <rect x="700" y="180" width="480" height="280" rx="28" fill="#ffe4ee" stroke="#f7b6cb" stroke-width="3"/>
  <text x="740" y="250" fill="#a13f6c" font-size="26" font-weight="700" font-family="system-ui,'PingFang SC','Noto Sans SC','Hiragino Sans',sans-serif">1. 放入完整網址</text>
  <text x="740" y="300" fill="#59364b" font-size="22" font-family="system-ui,'PingFang SC','Noto Sans SC','Hiragino Sans',sans-serif">https://cv.cm/zh-tw/qr/</text>
  <text x="740" y="360" fill="#59364b" font-size="22" font-family="system-ui,'PingFang SC','Noto Sans SC','Hiragino Sans',sans-serif">2. 下載 PNG</text>
  <text x="740" y="410" fill="#59364b" font-size="22" font-family="system-ui,'PingFang SC','Noto Sans SC','Hiragino Sans',sans-serif">3. 列印前用手機掃一次</text>
<text x="80" y="640" fill="#876579" font-size="18" font-family="system-ui,'PingFang SC','Noto Sans SC','Hiragino Sans',sans-serif">QR Code 只是一扇門。印五十張之前先掃通。</text>
</svg>
