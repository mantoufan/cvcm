  <text x="488" y="188" fill="#a13f6c" font-size="24" font-weight="700" font-family="system-ui,'PingFang SC','Noto Sans SC','Hiragino Sans',sans-serif">字母 · 數字 · 符號</text>
  <text x="488" y="228" fill="#59364b" font-size="18" font-family="system-ui,'PingFang SC','Noto Sans SC','Hiragino Sans',sans-serif">長度 16+。要手打就排除 0 O I l 1。</text>

  <rect x="840" y="140" width="360" height="260" rx="22" fill="#ffe4ee" stroke="#c83f79" stroke-width="3"/>
  <text x="868" y="188" fill="#a13f6c" font-size="24" font-weight="700" font-family="system-ui,'PingFang SC','Noto Sans SC','Hiragino Sans',sans-serif">複製一次 · 一個帳號 · 關掉分頁</text>
  <text x="868" y="228" fill="#59364b" font-size="18" font-family="system-ui,'PingFang SC','Noto Sans SC','Hiragino Sans',sans-serif">複製一次。貼進一個帳號。不要寄信。關掉分頁。</text>
<text x="80" y="500" fill="#876579" font-size="18" font-family="system-ui,'PingFang SC','Noto Sans SC','Hiragino Sans',sans-serif">複製一次。貼進一個帳號。不要寄信。關掉分頁。</text>
