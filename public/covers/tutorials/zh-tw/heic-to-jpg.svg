<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" role="img" aria-label="怎麼把 HEIC 轉成 JPG">
  <rect width="1280" height="720" rx="28" fill="#fff7fb"/>
  <text x="48" y="54" fill="#a13f6c" font-size="32" font-weight="800" font-family="system-ui,'PingFang SC','Noto Sans SC','Hiragino Sans',sans-serif">怎麼把 HEIC 轉成 JPG</text>
  <g font-family="system-ui,'PingFang SC','Noto Sans SC','Hiragino Sans',sans-serif">
    <rect x="90" y="160" width="320" height="360" rx="28" fill="#ffe4ee" stroke="#c83f79" stroke-width="4"/>
    <text x="130" y="240" fill="#a13f6c" font-size="26" font-weight="700">IMG_0123.HEIC</text>
    <text x="130" y="300" fill="#59364b" font-size="20">iPhone 預設格式</text>
    <text x="130" y="350" fill="#876579" font-size="18">Windows / WeChat</text>
    <text x="130" y="390" fill="#876579" font-size="18">經常打不開</text>
    <path d="M460 330 h90" stroke="#c83f79" stroke-width="10" stroke-linecap="round"/>
    <polygon points="550,310 610,330 550,350" fill="#c83f79"/>
    <rect x="650" y="160" width="480" height="360" rx="28" fill="#fff" stroke="#f7b6cb" stroke-width="4"/>
    <text x="700" y="240" fill="#a13f6c" font-size="26" font-weight="700">IMG_0123.jpg</text>
    <text x="700" y="300" fill="#59364b" font-size="20">像素一樣，格式更通用</text>
    <text x="700" y="360" fill="#59364b" font-size="20">寄到電腦前先打開看</text>
  </g>
<text x="90" y="640" fill="#876579" font-size="18" font-family="system-ui,'PingFang SC','Noto Sans SC','Hiragino Sans',sans-serif">Safari 和 Chrome 能解 HEIC。Windows 上的 Firefox 經常不行。</text>
</svg>
