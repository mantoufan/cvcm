<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" role="img" aria-label="邊長 10 cm 的正立方體剛好裝 1 公升。">
  <rect width="960" height="540" rx="28" fill="#fff7fb"/>
  <path d="M110 200 L310 200 L310 400 L110 400 Z" fill="#ffe4ee" stroke="#c83f79" stroke-width="5"/><path d="M110 200 L170 140 L370 140 L310 200 Z M310 200 L370 140 L370 340 L310 400 Z" fill="#fff7fb" stroke="#c83f79" stroke-width="5" stroke-linejoin="round"/><text x="210" y="440" fill="#876579" font-size="22" font-weight="400" text-anchor="middle" font-family="ui-monospace,Menlo,Consolas,monospace">10 cm</text><text x="385" y="250" fill="#876579" font-size="22" font-weight="400" text-anchor="start" font-family="ui-monospace,Menlo,Consolas,monospace">10 cm</text><text x="210" y="310" fill="#a13f6c" font-size="30" font-weight="800" text-anchor="middle" font-family="system-ui,'PingFang SC','Noto Sans SC','Hiragino Sans',sans-serif">1 公升</text><text x="540" y="170" fill="#59364b" font-size="26" font-weight="800" text-anchor="start" font-family="ui-monospace,Menlo,Consolas,monospace">1,000 cm³ = 1 L</text><text x="540" y="220" fill="#876579" font-size="22" font-weight="400" text-anchor="start" font-family="ui-monospace,Menlo,Consolas,monospace">1 cm³ = 1 mL</text><text x="540" y="270" fill="#876579" font-size="22" font-weight="400" text-anchor="start" font-family="ui-monospace,Menlo,Consolas,monospace">1 m³ = 1,000 L</text><text x="540" y="320" fill="#876579" font-size="22" font-weight="400" text-anchor="start" font-family="ui-monospace,Menlo,Consolas,monospace">1 US gal ≈ 3.785 L</text><text x="540" y="370" fill="#876579" font-size="22" font-weight="400" text-anchor="start" font-family="ui-monospace,Menlo,Consolas,monospace">1 ft³ ≈ 28.32 L</text>
