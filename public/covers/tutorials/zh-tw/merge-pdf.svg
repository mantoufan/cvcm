<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" role="img" aria-label="怎麼合併 PDF">
  <rect width="1280" height="720" rx="28" fill="#fff7fb"/>
  <text x="48" y="54" fill="#a13f6c" font-size="32" font-weight="800" font-family="system-ui,'PingFang SC','Noto Sans SC','Hiragino Sans',sans-serif">怎麼合併 PDF</text>
  <g font-family="system-ui,'PingFang SC','Noto Sans SC','Hiragino Sans',sans-serif">
    <rect x="80" y="160" width="200" height="260" rx="18" fill="#fff" stroke="#f7b6cb" stroke-width="4"/>
    <text x="110" y="220" fill="#a13f6c" font-size="22" font-weight="700">A · 3 頁</text>
    <rect x="320" y="160" width="200" height="260" rx="18" fill="#fff" stroke="#f7b6cb" stroke-width="4"/>
    <text x="350" y="220" fill="#a13f6c" font-size="22" font-weight="700">B · 2 頁</text>
    <path d="M560 280 h70" stroke="#c83f79" stroke-width="10" stroke-linecap="round"/>
    <polygon points="630,260 690,280 630,300" fill="#c83f79"/>
    <rect x="720" y="140" width="480" height="300" rx="22" fill="#ffe4ee" stroke="#c83f79" stroke-width="4"/>
    <text x="760" y="220" fill="#a13f6c" font-size="26" font-weight="700">一份檔 · 5 頁</text>
    <text x="760" y="280" fill="#59364b" font-size="20">列表順序就是頁序。</text>
    <text x="760" y="330" fill="#59364b" font-size="20">下載後再打開數頁數。</text>
  </g>
<text x="80" y="620" fill="#876579" font-size="18" font-family="system-ui,'PingFang SC','Noto Sans SC','Hiragino Sans',sans-serif">加密 PDF 要先解鎖再合併。</text>
</svg>
