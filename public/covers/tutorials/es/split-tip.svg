  <text x="664" y="246" fill="#59364b" font-size="16" font-family="system-ui,'PingFang SC','Noto Sans SC','Hiragino Sans',sans-serif">100 con 20%, 4 personas: total 120,00, cada uno 30,00.</text>
<text x="80" y="470" fill="#876579" font-size="18" font-family="system-ui,'PingFang SC','Noto Sans SC','Hiragino Sans',sans-serif">100 con 20%, 4 personas: total 120,00, cada uno 30,00.</text>
