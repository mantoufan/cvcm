  <text x="864" y="246" fill="#59364b" font-size="16" font-family="system-ui,'PingFang SC','Noto Sans SC','Hiragino Sans',sans-serif">El origen es la zona del reloj. Copie el UTC. No sume el desfase dos veces.</text>
<text x="80" y="470" fill="#876579" font-size="18" font-family="system-ui,'PingFang SC','Noto Sans SC','Hiragino Sans',sans-serif">El origen es la zona del reloj. Copie el UTC. No sume el desfase dos veces.</text>
