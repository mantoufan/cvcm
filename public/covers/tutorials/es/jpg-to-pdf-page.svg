<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" role="img" aria-label="A4 o ajuste a la foto">
  <rect width="960" height="540" rx="28" fill="#fff7fb"/>
  <text x="48" y="54" fill="#a13f6c" font-size="32" font-weight="800" font-family="system-ui,'PingFang SC','Noto Sans SC','Hiragino Sans',sans-serif">A4 o ajuste a la foto</text>
  <rect x="60" y="110" width="400" height="310" rx="22" fill="#ffe4ee" stroke="#c83f79" stroke-width="3"/>
  <text x="82" y="150" fill="#a13f6c" font-size="22" font-weight="700" font-family="system-ui,'PingFang SC','Noto Sans SC','Hiragino Sans',sans-serif">A4 / Letter</text>
  <text x="82" y="182" fill="#59364b" font-size="18" font-family="system-ui,'PingFang SC','Noto Sans SC','Hiragino Sans',sans-serif"><tspan x="82" dy="0">Formularios e impresoras.</tspan><tspan x="82" dy="22">Las fotos tienen margen.</tspan><tspan x="82" dy="22">Para deberes.</tspan></text>

  <rect x="500" y="110" width="400" height="310" rx="22" fill="#ffffff" stroke="#f2d9e5" stroke-width="3"/>
  <text x="522" y="150" fill="#a13f6c" font-size="22" font-weight="700" font-family="system-ui,'PingFang SC','Noto Sans SC','Hiragino Sans',sans-serif">Ajuste a la foto</text>
  <text x="522" y="182" fill="#59364b" font-size="18" font-family="system-ui,'PingFang SC','Noto Sans SC','Hiragino Sans',sans-serif"><tspan x="522" dy="0">Una imagen llena la página.</tspan><tspan x="522" dy="22">Mejor para un lookbook.</tspan><tspan x="522" dy="22">Peor para impresoras de oficina.</tspan></text>
<text x="48" y="500" fill="#876579" font-size="18" font-family="system-ui,'PingFang SC','Noto Sans SC','Hiragino Sans',sans-serif">Si la impresora recorta, eligió ajuste a foto en un trabajo A4.</text>
</svg>
