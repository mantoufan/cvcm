<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" role="img" aria-label="Cómo pasar PNG a WebP">
  <rect width="1280" height="720" rx="28" fill="#fff7fb"/>
  <text x="48" y="54" fill="#a13f6c" font-size="32" font-weight="800" font-family="system-ui,'PingFang SC','Noto Sans SC','Hiragino Sans',sans-serif">Cómo pasar PNG a WebP</text>
  <rect x="80" y="140" width="520" height="280" rx="22" fill="#ffffff" stroke="#f2d9e5" stroke-width="3"/>
  <text x="108" y="188" fill="#a13f6c" font-size="24" font-weight="700" font-family="system-ui,'PingFang SC','Noto Sans SC','Hiragino Sans',sans-serif">PNG</text>
  <text x="108" y="228" fill="#59364b" font-size="18" font-family="system-ui,'PingFang SC','Noto Sans SC','Hiragino Sans',sans-serif">PNG · más pesado · alfa</text>

  <rect x="680" y="140" width="520" height="280" rx="22" fill="#ffe4ee" stroke="#c83f79" stroke-width="3"/>
  <text x="708" y="188" fill="#a13f6c" font-size="24" font-weight="700" font-family="system-ui,'PingFang SC','Noto Sans SC','Hiragino Sans',sans-serif">WebP</text>
  <text x="708" y="228" fill="#59364b" font-size="18" font-family="system-ui,'PingFang SC','Noto Sans SC','Hiragino Sans',sans-serif">WebP · más liviano · alfa</text>
<text x="80" y="520" fill="#876579" font-size="18" font-family="system-ui,'PingFang SC','Noto Sans SC','Hiragino Sans',sans-serif">WebP puede conservar el fondo. JPG no. Los formularios viejos aún pueden pedir PNG.</text>
</svg>
