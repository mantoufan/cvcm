  </g>
<text x="48" y="500" fill="#876579" font-size="18" font-family="system-ui,'PingFang SC','Noto Sans SC','Hiragino Sans',sans-serif">El fondo PNG transparente se rellena en JPG, a menudo de negro.</text>
</svg>
