<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" role="img" aria-label="JPG rellena el área clara, a menudo de negro">
  <rect width="960" height="540" rx="28" fill="#fff7fb"/>
  <text x="48" y="54" fill="#a13f6c" font-size="24" font-weight="800" font-family="system-ui,'PingFang SC','Noto Sans SC','Hiragino Sans',sans-serif">JPG rellena el área clara, a menudo de negro</text>
  <g font-family="system-ui,'PingFang SC','Noto Sans SC','Hiragino Sans',sans-serif">
    <rect x="80" y="140" width="360" height="240" rx="20" fill="#ffe4ee" stroke="#c83f79" stroke-width="3"/>
    <circle cx="260" cy="260" r="54" fill="none" stroke="#c83f79" stroke-width="8" stroke-dasharray="10 8"/>
    <text x="260" y="420" text-anchor="middle" fill="#a13f6c" font-size="18">PNG</text>
    <rect x="520" y="140" width="360" height="240" rx="20" fill="#1b1216" stroke="#c83f79" stroke-width="3"/>
    <circle cx="700" cy="260" r="54" fill="#c83f79"/>
