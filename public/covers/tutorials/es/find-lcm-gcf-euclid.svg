<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" role="img" aria-label="Cada línea divide entre el último resto hasta que no queda nada.">
  <rect width="960" height="540" rx="28" fill="#fff7fb"/>
  <rect x="150" y="90" width="660" height="96" rx="18" fill="#ffffff" stroke="#f2d9e5" stroke-width="3"/><text x="190" y="152" fill="#a13f6c" font-size="36" font-weight="700" text-anchor="start" font-family="ui-monospace,Menlo,Consolas,monospace">18 = 1 × </text><text x="445" y="152" fill="#a13f6c" font-size="36" font-weight="800" text-anchor="start" font-family="ui-monospace,Menlo,Consolas,monospace">12</text><text x="510" y="152" fill="#a13f6c" font-size="36" font-weight="700" text-anchor="start" font-family="ui-monospace,Menlo,Consolas,monospace">+ 6</text><rect x="150" y="220" width="660" height="96" rx="18" fill="#ffe4ee" stroke="#c83f79" stroke-width="3"/><text x="190" y="282" fill="#a13f6c" font-size="36" font-weight="700" text-anchor="start" font-family="ui-monospace,Menlo,Consolas,monospace">12 = 2 × </text><text x="445" y="282" fill="#c83f79" font-size="36" font-weight="800" text-anchor="start" font-family="ui-monospace,Menlo,Consolas,monospace">6</text><text x="510" y="282" fill="#a13f6c" font-size="36" font-weight="700" text-anchor="start" font-family="ui-monospace,Menlo,Consolas,monospace">+ 0</text><line x1="665" y1="186" x2="470" y2="224" stroke="#c83f79" stroke-width="3" stroke-linecap="round"/><path d="M470 224 L480.8 215.1 L483.3 228.2 Z" fill="#c83f79"/><text x="480" y="390" fill="#a13f6c" font-size="24" font-weight="700" text-anchor="middle" font-family="system-ui,'PingFang SC','Noto Sans SC','Hiragino Sans',sans-serif">El último divisor es el MCD</text><text x="480" y="450" fill="#c83f79" font-size="40" font-weight="800" text-anchor="middle" font-family="ui-monospace,Menlo,Consolas,monospace">MCD = 6</text>
</svg>
