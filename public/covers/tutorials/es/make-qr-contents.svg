<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" role="img" aria-label="¿Qué debe abrir?">
  <rect width="960" height="540" rx="28" fill="#fff7fb"/>
  <text x="48" y="54" fill="#a13f6c" font-size="32" font-weight="800" font-family="system-ui,'PingFang SC','Noto Sans SC','Hiragino Sans',sans-serif">¿Qué debe abrir?</text>
  <rect x="40" y="100" width="280" height="320" rx="22" fill="#ffe4ee" stroke="#c83f79" stroke-width="3"/>
  <text x="62" y="140" fill="#a13f6c" font-size="22" font-weight="700" font-family="system-ui,'PingFang SC','Noto Sans SC','Hiragino Sans',sans-serif">URL</text>
  <text x="62" y="172" fill="#59364b" font-size="18" font-family="system-ui,'PingFang SC','Noto Sans SC','Hiragino Sans',sans-serif"><tspan x="62" dy="0">Página, menú</tspan><tspan x="62" dy="22">o pago.</tspan><tspan x="62" dy="22">Use https.</tspan></text>

  <rect x="340" y="100" width="280" height="320" rx="22" fill="#ffffff" stroke="#f2d9e5" stroke-width="3"/>
  <text x="362" y="140" fill="#a13f6c" font-size="22" font-weight="700" font-family="system-ui,'PingFang SC','Noto Sans SC','Hiragino Sans',sans-serif">Texto</text>
  <text x="362" y="172" fill="#59364b" font-size="18" font-family="system-ui,'PingFang SC','Noto Sans SC','Hiragino Sans',sans-serif"><tspan x="362" dy="0">Nombre Wi-Fi,</tspan><tspan x="362" dy="22">número de mesa,</tspan><tspan x="362" dy="22">nota corta.</tspan></text>

  <rect x="640" y="100" width="280" height="320" rx="22" fill="#ffffff" stroke="#f2d9e5" stroke-width="3"/>
  <text x="662" y="140" fill="#a13f6c" font-size="22" font-weight="700" font-family="system-ui,'PingFang SC','Noto Sans SC','Hiragino Sans',sans-serif">No</text>
  <text x="662" y="172" fill="#59364b" font-size="18" font-family="system-ui,'PingFang SC','Noto Sans SC','Hiragino Sans',sans-serif"><tspan x="662" dy="0">No codifique un</tspan><tspan x="662" dy="22">archivo. Súbalo</tspan><tspan x="662" dy="22">y codifique el enlace.</tspan></text>
<text x="48" y="500" fill="#876579" font-size="18" font-family="system-ui,'PingFang SC','Noto Sans SC','Hiragino Sans',sans-serif">Si el destino cambia, use una URL corta que controle.</text>
</svg>
