<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" role="img" aria-label="Cómo contar palabras y caracteres">
  <rect width="1280" height="720" rx="28" fill="#fff7fb"/>
  <text x="48" y="54" fill="#a13f6c" font-size="32" font-weight="800" font-family="system-ui,'PingFang SC','Noto Sans SC','Hiragino Sans',sans-serif">Cómo contar palabras y caracteres</text>
  <g font-family="system-ui,'PingFang SC','Noto Sans SC','Hiragino Sans',sans-serif">
    <rect x="80" y="160" width="340" height="300" rx="22" fill="#ffe4ee" stroke="#c83f79" stroke-width="3"/>
    <text x="110" y="280" fill="#a13f6c" font-size="28" font-weight="700">Palabras</text>
    <rect x="460" y="160" width="340" height="300" rx="22" fill="#fff" stroke="#f7b6cb" stroke-width="3"/>
    <text x="490" y="280" fill="#a13f6c" font-size="28" font-weight="700">Caracteres</text>
    <rect x="840" y="160" width="360" height="300" rx="22" fill="#fff" stroke="#f7b6cb" stroke-width="3"/>
    <text x="870" y="280" fill="#a13f6c" font-size="28" font-weight="700">Sin espacios</text>
  </g>
<text x="80" y="620" fill="#876579" font-size="18" font-family="system-ui,'PingFang SC','Noto Sans SC','Hiragino Sans',sans-serif">Tres trabajos, tres cifras. Los deberes en chino, sin espacios.</text>
</svg>
