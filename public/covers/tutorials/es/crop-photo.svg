<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" role="img" aria-label="Cómo recortar una foto">
  <rect width="1280" height="720" rx="28" fill="#fff7fb"/>
  <text x="48" y="54" fill="#a13f6c" font-size="32" font-weight="800" font-family="system-ui,'PingFang SC','Noto Sans SC','Hiragino Sans',sans-serif">Cómo recortar una foto</text>
  <g font-family="system-ui,'PingFang SC','Noto Sans SC','Hiragino Sans',sans-serif">
    <rect x="80" y="140" width="640" height="420" rx="24" fill="#ffe4ee"/>
    <rect x="180" y="180" width="360" height="340" rx="8" fill="none" stroke="#c83f79" stroke-width="8"/>
    <text x="200" y="230" fill="#a13f6c" font-size="22" font-weight="700">Conserve 4:5</text>
    <text x="780" y="230" fill="#a13f6c" font-size="24" font-weight="700">Elija el ratio primero</text>
    <text x="780" y="290" fill="#59364b" font-size="20">1:1 avatar</text>
    <text x="780" y="340" fill="#59364b" font-size="20">4:5 publicación vertical</text>
    <text x="780" y="390" fill="#59364b" font-size="20">16:9 portada / paisaje</text>
    <text x="780" y="460" fill="#59364b" font-size="20">Luego mueva el recuadro, no el ratio.</text>
  </g>
<text x="80" y="640" fill="#876579" font-size="18" font-family="system-ui,'PingFang SC','Noto Sans SC','Hiragino Sans',sans-serif">Recortar tira píxeles. Conserve el original.</text>
</svg>
