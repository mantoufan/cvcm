<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" role="img" aria-label="Sepa qué número necesita">
  <rect width="960" height="540" rx="28" fill="#fff7fb"/>
  <text x="48" y="54" fill="#a13f6c" font-size="28" font-weight="800" font-family="system-ui,'PingFang SC','Noto Sans SC','Hiragino Sans',sans-serif">Sepa qué número necesita</text>
  <g font-family="system-ui,'PingFang SC','Noto Sans SC','Hiragino Sans',sans-serif" font-size="22" fill="#59364b">
    <text x="80" y="180">Palabras</text>
    <text x="80" y="240">Caracteres</text>
    <text x="80" y="300">Sin espacios</text>
  </g>
<text x="48" y="500" fill="#876579" font-size="18" font-family="system-ui,'PingFang SC','Noto Sans SC','Hiragino Sans',sans-serif">Tres trabajos, tres cifras. Los deberes en chino, sin espacios.</text>
</svg>
