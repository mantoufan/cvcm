<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" role="img" aria-label="Fórmulas de las tres figuras que más usará.">
  <rect width="960" height="540" rx="28" fill="#fff7fb"/>
  <rect x="60" y="70" width="260" height="400" rx="18" fill="#ffffff" stroke="#f2d9e5" stroke-width="3"/><rect x="100" y="150" width="180" height="110" fill="#ffe4ee" stroke="#c83f79" stroke-width="5"/><text x="190" y="290" fill="#59364b" font-size="26" font-weight="700" text-anchor="middle" font-family="'Cambria Math','STIX Two Math','Noto Sans Math','Apple Symbols',system-ui,sans-serif">l</text><text x="298" y="212" fill="#59364b" font-size="26" font-weight="700" text-anchor="start" font-family="'Cambria Math','STIX Two Math','Noto Sans Math','Apple Symbols',system-ui,sans-serif">w</text><text x="190" y="120" fill="#a13f6c" font-size="24" font-weight="800" text-anchor="middle" font-family="system-ui,'PingFang SC','Noto Sans SC','Hiragino Sans',sans-serif">Rectángulo</text><text x="190" y="360" fill="#a13f6c" font-size="26" font-weight="800" text-anchor="middle" font-family="'Cambria Math','STIX Two Math','Noto Sans Math','Apple Symbols',system-ui,sans-serif">A = l × w</text><text x="190" y="410" fill="#876579" font-size="22" font-weight="400" text-anchor="middle" font-family="ui-monospace,Menlo,Consolas,monospace">5 × 3 = 15</text><rect x="350" y="70" width="260" height="400" rx="18" fill="#ffffff" stroke="#f2d9e5" stroke-width="3"/><path d="M380 265 L580 265 L470 150 Z" fill="#ffe4ee" stroke="#c83f79" stroke-width="5" stroke-linejoin="round"/><line x1="470" y1="150" x2="470" y2="265" stroke="#a13f6c" stroke-width="3" stroke-dasharray="8 6"/><text x="480" y="295" fill="#59364b" font-size="26" font-weight="700" text-anchor="middle" font-family="'Cambria Math','STIX Two Math','Noto Sans Math','Apple Symbols',system-ui,sans-serif">b</text><text x="480" y="222" fill="#59364b" font-size="26" font-weight="700" text-anchor="start" font-family="'Cambria Math','STIX Two Math','Noto Sans Math','Apple Symbols',system-ui,sans-serif">h</text><text x="480" y="120" fill="#a13f6c" font-size="24" font-weight="800" text-anchor="middle" font-family="system-ui,'PingFang SC','Noto Sans SC','Hiragino Sans',sans-serif">Triángulo</text><text x="480" y="360" fill="#a13f6c" font-size="26" font-weight="800" text-anchor="middle" font-family="'Cambria Math','STIX Two Math','Noto Sans Math','Apple Symbols',system-ui,sans-serif">A = ½ × b × h</text><text x="480" y="410" fill="#876579" font-size="22" font-weight="400" text-anchor="middle" font-family="ui-monospace,Menlo,Consolas,monospace">½ × 6 × 4 = 12</text><rect x="640" y="70" width="260" height="400" rx="18" fill="#ffffff" stroke="#f2d9e5" stroke-width="3"/><circle cx="770" cy="210" r="70" fill="#ffe4ee" stroke="#c83f79" stroke-width="5"/><line x1="770" y1="210" x2="840" y2="210" stroke="#a13f6c" stroke-width="3" stroke-linecap="round"/><text x="805" y="200" fill="#59364b" font-size="26" font-weight="700" text-anchor="middle" font-family="'Cambria Math','STIX Two Math','Noto Sans Math','Apple Symbols',system-ui,sans-serif">r</text><text x="770" y="120" fill="#a13f6c" font-size="24" font-weight="800" text-anchor="middle" font-family="system-ui,'PingFang SC','Noto Sans SC','Hiragino Sans',sans-serif">Círculo</text><text x="770" y="360" fill="#a13f6c" font-size="26" font-weight="800" text-anchor="middle" font-family="'Cambria Math','STIX Two Math','Noto Sans Math','Apple Symbols',system-ui,sans-serif">A = π × r²</text><text x="770" y="410" fill="#876579" font-size="22" font-weight="400" text-anchor="middle" font-family="ui-monospace,Menlo,Consolas,monospace">π × 2² ≈ 12,566</text>
</svg>
