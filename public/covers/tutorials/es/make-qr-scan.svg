<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" role="img" aria-label="Escanear antes de imprimir">
  <rect width="960" height="540" rx="28" fill="#fff7fb"/>
  <text x="48" y="54" fill="#a13f6c" font-size="32" font-weight="800" font-family="system-ui,'PingFang SC','Noto Sans SC','Hiragino Sans',sans-serif">Escanear antes de imprimir</text>
  <rect x="80" y="120" width="220" height="300" rx="36" fill="#fff" stroke="#c83f79" stroke-width="6"/>
  <rect x="110" y="160" width="160" height="160" rx="12" fill="#ffe4ee"/>
  <rect x="150" y="360" width="80" height="10" rx="5" fill="#f7b6cb"/>
  <text x="360" y="200" fill="#a13f6c" font-size="24" font-weight="700" font-family="system-ui,'PingFang SC','Noto Sans SC','Hiragino Sans',sans-serif">Vista de cámara</text>
  <text x="360" y="250" fill="#59364b" font-size="20" font-family="system-ui,'PingFang SC','Noto Sans SC','Hiragino Sans',sans-serif">A 20–30 cm.</text>
  <text x="360" y="300" fill="#59364b" font-size="20" font-family="system-ui,'PingFang SC','Noto Sans SC','Hiragino Sans',sans-serif">Debe abrir la página, no un buscador.</text>
  <text x="360" y="350" fill="#59364b" font-size="20" font-family="system-ui,'PingFang SC','Noto Sans SC','Hiragino Sans',sans-serif">Deje un margen blanco.</text>
  <text x="360" y="400" fill="#59364b" font-size="20" font-family="system-ui,'PingFang SC','Noto Sans SC','Hiragino Sans',sans-serif">Al menos 2 cm. No lo estire.</text>
<text x="48" y="500" fill="#876579" font-size="18" font-family="system-ui,'PingFang SC','Noto Sans SC','Hiragino Sans',sans-serif">Si falla en la cocina, fallará en la puerta.</text>
</svg>
