<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" role="img" aria-label="Fórmulas de tres cuerpos habituales.">
  <rect width="960" height="540" rx="28" fill="#fff7fb"/>
  <rect x="60" y="70" width="260" height="400" rx="18" fill="#ffffff" stroke="#f2d9e5" stroke-width="3"/><path d="M95 180 L245 180 L245 280 L95 280 Z" fill="#ffe4ee" stroke="#c83f79" stroke-width="4"/><path d="M95 180 L135 145 L285 145 L245 180 Z M245 180 L285 145 L285 245 L245 280 Z" fill="#fff7fb" stroke="#c83f79" stroke-width="4" stroke-linejoin="round"/><text x="190" y="120" fill="#a13f6c" font-size="24" font-weight="800" text-anchor="middle" font-family="system-ui,'PingFang SC','Noto Sans SC','Hiragino Sans',sans-serif">Caja</text><text x="190" y="360" fill="#a13f6c" font-size="26" font-weight="800" text-anchor="middle" font-family="'Cambria Math','STIX Two Math','Noto Sans Math','Apple Symbols',system-ui,sans-serif">V = l × w × h</text><text x="190" y="410" fill="#876579" font-size="20" font-weight="400" text-anchor="middle" font-family="ui-monospace,Menlo,Consolas,monospace">30 × 20 × 10 = 6000</text><rect x="350" y="70" width="260" height="400" rx="18" fill="#ffffff" stroke="#f2d9e5" stroke-width="3"/><path d="M420 160 L420 270 A60 18 0 0 0 540 270 L540 160" fill="#ffe4ee" stroke="#c83f79" stroke-width="4"/><ellipse cx="480" cy="160" rx="60" ry="18" fill="#fff7fb" stroke="#c83f79" stroke-width="4"/><line x1="480" y1="160" x2="540" y2="160" stroke="#a13f6c" stroke-width="3" stroke-linecap="round"/><text x="554" y="168" fill="#59364b" font-size="24" font-weight="700" text-anchor="start" font-family="'Cambria Math','STIX Two Math','Noto Sans Math','Apple Symbols',system-ui,sans-serif">r</text><text x="556" y="222" fill="#59364b" font-size="24" font-weight="700" text-anchor="start" font-family="'Cambria Math','STIX Two Math','Noto Sans Math','Apple Symbols',system-ui,sans-serif">h</text><text x="480" y="120" fill="#a13f6c" font-size="24" font-weight="800" text-anchor="middle" font-family="system-ui,'PingFang SC','Noto Sans SC','Hiragino Sans',sans-serif">Cilindro</text><text x="480" y="360" fill="#a13f6c" font-size="26" font-weight="800" text-anchor="middle" font-family="'Cambria Math','STIX Two Math','Noto Sans Math','Apple Symbols',system-ui,sans-serif">V = π × r² × h</text><text x="480" y="410" fill="#876579" font-size="20" font-weight="400" text-anchor="middle" font-family="ui-monospace,Menlo,Consolas,monospace">π × 4² × 10 ≈ 502,65</text><rect x="640" y="70" width="260" height="400" rx="18" fill="#ffffff" stroke="#f2d9e5" stroke-width="3"/><circle cx="770" cy="215" r="70" fill="#ffe4ee" stroke="#c83f79" stroke-width="4"/><ellipse cx="770" cy="215" rx="70" ry="20" fill="none" stroke="#c83f79" stroke-width="2" stroke-dasharray="6 6"/><line x1="770" y1="215" x2="840" y2="215" stroke="#a13f6c" stroke-width="3" stroke-linecap="round"/><text x="805" y="246" fill="#59364b" font-size="24" font-weight="700" text-anchor="middle" font-family="'Cambria Math','STIX Two Math','Noto Sans Math','Apple Symbols',system-ui,sans-serif">r</text><text x="770" y="120" fill="#a13f6c" font-size="24" font-weight="800" text-anchor="middle" font-family="system-ui,'PingFang SC','Noto Sans SC','Hiragino Sans',sans-serif">Esfera</text><text x="770" y="360" fill="#a13f6c" font-size="26" font-weight="800" text-anchor="middle" font-family="'Cambria Math','STIX Two Math','Noto Sans Math','Apple Symbols',system-ui,sans-serif">V = 4/3 × π × r³</text><text x="770" y="410" fill="#876579" font-size="20" font-weight="400" text-anchor="middle" font-family="ui-monospace,Menlo,Consolas,monospace">4/3 × π × 3³ ≈ 113,1</text>
</svg>
