<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" role="img" aria-label="Cómo dividir un PDF">
  <rect width="1280" height="720" rx="28" fill="#fff7fb"/>
  <text x="48" y="54" fill="#a13f6c" font-size="32" font-weight="800" font-family="system-ui,'PingFang SC','Noto Sans SC','Hiragino Sans',sans-serif">Cómo dividir un PDF</text>
  <g font-family="system-ui,'PingFang SC','Noto Sans SC','Hiragino Sans',sans-serif">
    <rect x="80" y="160" width="280" height="340" rx="20" fill="#fff" stroke="#c83f79" stroke-width="5"/>
    <text x="110" y="240" fill="#a13f6c" font-size="24" font-weight="700">10 pages</text>
    <path d="M400 320 h70" stroke="#c83f79" stroke-width="10" stroke-linecap="round"/>
    <polygon points="470,300 530,320 470,340" fill="#c83f79"/>
    <rect x="560" y="180" width="160" height="200" rx="14" fill="#ffe4ee"/>
    <rect x="740" y="200" width="160" height="200" rx="14" fill="#ffe4ee"/>
    <rect x="920" y="220" width="160" height="200" rx="14" fill="#ffe4ee"/>
    <text x="560" y="520" fill="#59364b" font-size="20">Cada página → ZIP</text>
  </g>
<text x="80" y="640" fill="#876579" font-size="18" font-family="system-ui,'PingFang SC','Noto Sans SC','Hiragino Sans',sans-serif">Los cifrados hay que desbloquearlos.</text>
</svg>
