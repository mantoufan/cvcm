<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" role="img" aria-label="Abra una página al 100%">
  <rect width="960" height="540" rx="28" fill="#fff7fb"/>
  <text x="48" y="54" fill="#a13f6c" font-size="32" font-weight="800" font-family="system-ui,'PingFang SC','Noto Sans SC','Hiragino Sans',sans-serif">Abra una página al 100%</text>
  <g font-family="system-ui,'PingFang SC','Noto Sans SC','Hiragino Sans',sans-serif" fill="#59364b" font-size="20">
    <rect x="70" y="130" width="820" height="260" rx="22" fill="#fff" stroke="#f7b6cb" stroke-width="3"/>
    <text x="110" y="200">Al 100%, lea una línea de texto.</text>
    <text x="110" y="250">Si los dígitos de una tabla se corren, use 2× y PNG.</text>
    <text x="110" y="300">Un ZIP de todas las páginas es más fácil que guardar una a una.</text>
  </g>
<text x="48" y="500" fill="#876579" font-size="18" font-family="system-ui,'PingFang SC','Noto Sans SC','Hiragino Sans',sans-serif">La miniatura puede verse bien y la página no.</text>
</svg>
