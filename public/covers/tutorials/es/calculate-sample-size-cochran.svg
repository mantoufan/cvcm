<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" role="img" aria-label="La fórmula de Cochran con un 95 % de confianza, un margen de ±5 % y p = 50 %.">
  <rect width="960" height="540" rx="28" fill="#fff7fb"/>
  <rect x="60" y="50" width="840" height="250" rx="22" fill="#ffffff" stroke="#f2d9e5" stroke-width="3"/><text x="480" y="150" fill="#59364b" font-size="56" font-weight="800" text-anchor="middle" font-family="'Cambria Math','STIX Two Math','Noto Sans Math','Apple Symbols',system-ui,sans-serif">n₀ = z² · p (1 − p) ÷ e²</text><text x="350" y="215" fill="#a13f6c" font-size="24" font-weight="800" text-anchor="middle" font-family="system-ui,'PingFang SC','Noto Sans SC','Hiragino Sans',sans-serif">z = 1,96</text><text x="520" y="215" fill="#a13f6c" font-size="24" font-weight="800" text-anchor="middle" font-family="system-ui,'PingFang SC','Noto Sans SC','Hiragino Sans',sans-serif">p = 50 %</text><text x="720" y="215" fill="#a13f6c" font-size="24" font-weight="800" text-anchor="middle" font-family="system-ui,'PingFang SC','Noto Sans SC','Hiragino Sans',sans-serif">e = 5 %</text><text x="350" y="244.0" fill="#876579" font-size="18" font-weight="700" text-anchor="middle" font-family="system-ui,'PingFang SC','Noto Sans SC','Hiragino Sans',sans-serif">95 % de</text><text x="350" y="266.0" fill="#876579" font-size="18" font-weight="700" text-anchor="middle" font-family="system-ui,'PingFang SC','Noto Sans SC','Hiragino Sans',sans-serif">confianza</text><text x="520" y="244.0" fill="#876579" font-size="18" font-weight="700" text-anchor="middle" font-family="system-ui,'PingFang SC','Noto Sans SC','Hiragino Sans',sans-serif">proporción</text><text x="520" y="266.0" fill="#876579" font-size="18" font-weight="700" text-anchor="middle" font-family="system-ui,'PingFang SC','Noto Sans SC','Hiragino Sans',sans-serif">esperada</text><text x="720" y="244.0" fill="#876579" font-size="18" font-weight="700" text-anchor="middle" font-family="system-ui,'PingFang SC','Noto Sans SC','Hiragino Sans',sans-serif">margen</text><text x="720" y="266.0" fill="#876579" font-size="18" font-weight="700" text-anchor="middle" font-family="system-ui,'PingFang SC','Noto Sans SC','Hiragino Sans',sans-serif">de error</text><rect x="60" y="330" width="840" height="170" rx="22" fill="#ffe4ee" stroke="#c83f79" stroke-width="3"/><text x="480" y="395" fill="#59364b" font-size="32" font-weight="800" text-anchor="middle" font-family="ui-monospace,Menlo,Consolas,monospace">1,96² × 0,5 × 0,5 ÷ 0,05² = 384,2</text><text x="480" y="460" fill="#a13f6c" font-size="34" font-weight="800" text-anchor="middle" font-family="system-ui,'PingFang SC','Noto Sans SC','Hiragino Sans',sans-serif">redondear → 385 personas</text>
</svg>
