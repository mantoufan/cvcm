<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" role="img" aria-label="Cómo hacer una factura PDF">
  <rect width="1280" height="720" rx="28" fill="#fff7fb"/>
  <text x="48" y="54" fill="#a13f6c" font-size="32" font-weight="800" font-family="system-ui,'PingFang SC','Noto Sans SC','Hiragino Sans',sans-serif">Cómo hacer una factura PDF</text>
  <rect x="80" y="140" width="360" height="260" rx="22" fill="#ffffff" stroke="#f2d9e5" stroke-width="3"/>
  <text x="108" y="188" fill="#a13f6c" font-size="24" font-weight="700" font-family="system-ui,'PingFang SC','Noto Sans SC','Hiragino Sans',sans-serif">De</text>
  <text x="108" y="228" fill="#59364b" font-size="18" font-family="system-ui,'PingFang SC','Noto Sans SC','Hiragino Sans',sans-serif">De, facturar a, y una línea por ítem.</text>

  <rect x="460" y="140" width="360" height="260" rx="22" fill="#ffffff" stroke="#f2d9e5" stroke-width="3"/>
  <text x="488" y="188" fill="#a13f6c" font-size="24" font-weight="700" font-family="system-ui,'PingFang SC','Noto Sans SC','Hiragino Sans',sans-serif">Facturar a</text>
  <text x="488" y="228" fill="#59364b" font-size="18" font-family="system-ui,'PingFang SC','Noto Sans SC','Hiragino Sans',sans-serif">cantidad × precio</text>

  <rect x="840" y="140" width="360" height="260" rx="22" fill="#ffe4ee" stroke="#c83f79" stroke-width="3"/>
  <text x="868" y="188" fill="#a13f6c" font-size="24" font-weight="700" font-family="system-ui,'PingFang SC','Noto Sans SC','Hiragino Sans',sans-serif">PDF</text>
  <text x="868" y="228" fill="#59364b" font-size="18" font-family="system-ui,'PingFang SC','Noto Sans SC','Hiragino Sans',sans-serif">Impuesto % del subtotal · no es una declaración</text>
<text x="80" y="500" fill="#876579" font-size="18" font-family="system-ui,'PingFang SC','Noto Sans SC','Hiragino Sans',sans-serif">El impuesto es un porcentaje del subtotal. Abra el PDF. No es una declaración fiscal.</text>
</svg>
