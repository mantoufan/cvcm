<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" role="img" aria-label="Cuente páginas tras exportar">
  <rect width="960" height="540" rx="28" fill="#fff7fb"/>
  <text x="48" y="54" fill="#a13f6c" font-size="32" font-weight="800" font-family="system-ui,'PingFang SC','Noto Sans SC','Hiragino Sans',sans-serif">Cuente páginas tras exportar</text>
  <g font-family="system-ui,'PingFang SC','Noto Sans SC','Hiragino Sans',sans-serif">
    <text x="80" y="180" fill="#59364b" font-size="22">4 fotos soltadas</text>
    <text x="80" y="240" fill="#c83f79" font-size="40" font-weight="800">→ 4 páginas</text>
    <text x="80" y="320" fill="#59364b" font-size="20">Si ve 3, un archivo no se decodificó.</text>
    <text x="80" y="370" fill="#59364b" font-size="20">HEIC puede fallar en Firefox: páselo a JPG primero.</text>
  </g>
<text x="48" y="500" fill="#876579" font-size="18" font-family="system-ui,'PingFang SC','Noto Sans SC','Hiragino Sans',sans-serif">Abra el PDF. No confíe solo en el aviso de descarga.</text>
</svg>
