  <text x="868" y="228" fill="#59364b" font-size="18" font-family="system-ui,'PingFang SC','Noto Sans SC','Hiragino Sans',sans-serif">Copie una vez. Péguela en una cuenta. No la envíe por correo. Cierre la pestaña.</text>
<text x="80" y="500" fill="#876579" font-size="18" font-family="system-ui,'PingFang SC','Noto Sans SC','Hiragino Sans',sans-serif">Copie una vez. Péguela en una cuenta. No la envíe por correo. Cierre la pestaña.</text>
