<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" role="img" aria-label="Top sets up. Bottom pays off.">
  <rect width="960" height="540" rx="28" fill="#fff7fb"/>
  <text x="48" y="54" fill="#a13f6c" font-size="28" font-weight="800" font-family="system-ui,'PingFang SC','Noto Sans SC','Hiragino Sans',sans-serif">Top sets up. Bottom pays off.</text>
  <g font-family="system-ui,'PingFang SC','Noto Sans SC','Hiragino Sans',sans-serif">
    <text x="80" y="200" fill="#a13f6c" font-size="28" font-weight="700">TOP LINE</text>
    <text x="80" y="280" fill="#59364b" font-size="28" font-weight="700">BOTTOM LINE</text>
  </g>
<text x="48" y="500" fill="#876579" font-size="18" font-family="system-ui,'PingFang SC','Noto Sans SC','Hiragino Sans',sans-serif">Short lines. Stroke. Do not cover the face.</text>
</svg>
