<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" role="img" aria-label="PNG keeps a clear background">
  <rect width="960" height="540" rx="28" fill="#fff7fb"/>
  <text x="48" y="54" fill="#a13f6c" font-size="28" font-weight="800" font-family="system-ui,'PingFang SC','Noto Sans SC','Hiragino Sans',sans-serif">PNG keeps a clear background</text>
  <g font-family="system-ui,'PingFang SC','Noto Sans SC','Hiragino Sans',sans-serif">
    <rect x="70" y="130" width="380" height="250" rx="20" fill="#fff" stroke="#c83f79" stroke-width="4"/>
    <text x="100" y="250" fill="#a13f6c" font-size="22" font-weight="700">PNG keeps a clear background</text>
    <rect x="510" y="130" width="380" height="250" rx="20" fill="#ffe4ee" stroke="#f7b6cb" stroke-width="3"/>
    <text x="540" y="250" fill="#59364b" font-size="22">JPG fills it in</text>
  </g>
<text x="48" y="500" fill="#876579" font-size="18" font-family="system-ui,'PingFang SC','Noto Sans SC','Hiragino Sans',sans-serif">Pick PNG if you need a clear background. JPG will fill it.</text>
</svg>
