<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" role="img" aria-label="Check PDF to JPG output">
  <rect width="960" height="540" rx="28" fill="#fff7fb"/>
  <text x="48" y="54" fill="#a13f6c" font-size="32" font-weight="800" font-family="system-ui,sans-serif">Open a page at 100%</text>
  <g font-family="system-ui,sans-serif" fill="#59364b" font-size="22">
    <rect x="70" y="130" width="820" height="260" rx="22" fill="#fff" stroke="#f7b6cb" stroke-width="3"/>
    <text x="110" y="200">Zoom to 100% and read a line of body text.</text>
    <text x="110" y="250">If digits in a table smear, use 2× and PNG.</text>
    <text x="110" y="300">A ZIP of all pages is easier than one-by-one saves.</text>
  </g>
<text x="48" y="500" fill="#876579" font-size="18" font-family="system-ui,sans-serif">A thumbnail can look fine while the full page does not.</text>
</svg>
