<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" role="img" aria-label="怎么算折扣">
  <rect width="1280" height="720" rx="28" fill="#fff7fb"/>
  <text x="48" y="54" fill="#a13f6c" font-size="24" font-weight="800" font-family="system-ui,'PingFang SC','Noto Sans SC','Hiragino Sans',sans-serif">怎么算折扣</text>
  <rect x="80" y="150" width="520" height="220" rx="22" fill="#ffe4ee" stroke="#c83f79" stroke-width="3"/>
  <text x="104" y="202" fill="#a13f6c" font-size="22" font-weight="700" font-family="system-ui,'PingFang SC','Noto Sans SC','Hiragino Sans',sans-serif">100 的 20% = 80.00</text>
  <text x="104" y="246" fill="#59364b" font-size="16" font-family="system-ui,'PingFang SC','Noto Sans SC','Hiragino Sans',sans-serif">不是 20% 利润率</text>

  <rect x="640" y="150" width="560" height="220" rx="22" fill="#ffffff" stroke="#f2d9e5" stroke-width="3"/>
  <text x="664" y="202" fill="#a13f6c" font-size="22" font-weight="700" font-family="system-ui,'PingFang SC','Noto Sans SC','Hiragino Sans',sans-serif">120% 折扣 = -20.00</text>
  <text x="664" y="246" fill="#59364b" font-size="16" font-family="system-ui,'PingFang SC','Noto Sans SC','Hiragino Sans',sans-serif">折扣是从标价上减。利润率是利润除以售价。</text>
<text x="80" y="470" fill="#876579" font-size="18" font-family="system-ui,'PingFang SC','Noto Sans SC','Hiragino Sans',sans-serif">折扣是从标价上减。利润率是利润除以售价。</text>
</svg>
