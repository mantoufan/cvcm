<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" role="img" aria-label="上一句铺垫，下一句收束。">
  <rect width="960" height="540" rx="28" fill="#fff7fb"/>
  <text x="48" y="54" fill="#a13f6c" font-size="28" font-weight="800" font-family="system-ui,'PingFang SC','Noto Sans SC','Hiragino Sans',sans-serif">上一句铺垫，下一句收束。</text>
  <g font-family="system-ui,'PingFang SC','Noto Sans SC','Hiragino Sans',sans-serif">
    <text x="80" y="200" fill="#a13f6c" font-size="28" font-weight="700">上一句</text>
    <text x="80" y="280" fill="#59364b" font-size="28" font-weight="700">下一句</text>
  </g>
<text x="48" y="500" fill="#876579" font-size="18" font-family="system-ui,'PingFang SC','Noto Sans SC','Hiragino Sans',sans-serif">句子要短。要描边。不要挡住脸。</text>
</svg>
