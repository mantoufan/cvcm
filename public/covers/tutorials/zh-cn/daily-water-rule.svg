<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" role="img" aria-label="35 ml × 公斤 + 12 ml × 分钟">
  <rect width="960" height="540" rx="28" fill="#fff7fb"/>
  <text x="48" y="54" fill="#a13f6c" font-size="22" font-weight="800" font-family="system-ui,'PingFang SC','Noto Sans SC','Hiragino Sans',sans-serif">每天该喝多少水</text>
  <rect x="70" y="140" width="820" height="200" rx="22" fill="#ffe4ee" stroke="#c83f79" stroke-width="3"/>
