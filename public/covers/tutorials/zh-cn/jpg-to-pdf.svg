<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" role="img" aria-label="怎么把 JPG 转成 PDF">
  <rect width="1280" height="720" rx="28" fill="#fff7fb"/>
  <text x="48" y="54" fill="#a13f6c" font-size="32" font-weight="800" font-family="system-ui,'PingFang SC','Noto Sans SC','Hiragino Sans',sans-serif">怎么把 JPG 转成 PDF</text>
  <g font-family="system-ui,'PingFang SC','Noto Sans SC','Hiragino Sans',sans-serif">
    <rect x="80" y="180" width="160" height="200" rx="16" fill="#ffe4ee" stroke="#f7b6cb" stroke-width="3"/>
    <rect x="180" y="200" width="160" height="200" rx="16" fill="#fff" stroke="#f7b6cb" stroke-width="3"/>
    <rect x="280" y="220" width="160" height="200" rx="16" fill="#fff" stroke="#c83f79" stroke-width="4"/>
    <path d="M500 320 h80" stroke="#c83f79" stroke-width="10" stroke-linecap="round"/>
    <polygon points="580,300 640,320 580,340" fill="#c83f79"/>
    <rect x="680" y="160" width="460" height="360" rx="20" fill="#fff" stroke="#c83f79" stroke-width="5"/>
    <text x="720" y="240" fill="#a13f6c" font-size="26" font-weight="700">一份 PDF</text>
    <text x="720" y="300" fill="#59364b" font-size="20">第 1 页 · 第 2 页 · 第 3 页</text>
    <text x="720" y="360" fill="#59364b" font-size="20">A4、Letter，或按照片铺满</text>
  </g>
<text x="80" y="620" fill="#876579" font-size="18" font-family="system-ui,'PingFang SC','Noto Sans SC','Hiragino Sans',sans-serif">列表顺序就是页序。打开 PDF 翻一遍。</text>
</svg>
