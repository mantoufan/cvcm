  <rect x="80" y="150" width="520" height="220" rx="22" fill="#ffffff" stroke="#f2d9e5" stroke-width="3"/>
  <text x="104" y="202" fill="#a13f6c" font-size="22" font-weight="700" font-family="system-ui,'PingFang SC','Noto Sans SC','Hiragino Sans',sans-serif">2026-03-14 = 25 岁</text>
  <text x="104" y="246" fill="#59364b" font-size="16" font-family="system-ui,'PingFang SC','Noto Sans SC','Hiragino Sans',sans-serif">2000 年 3 月 15 日出生。这一岁要等到生日。</text>

  <rect x="640" y="150" width="560" height="220" rx="22" fill="#ffe4ee" stroke="#c83f79" stroke-width="3"/>
