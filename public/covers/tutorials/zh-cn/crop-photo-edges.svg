<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" role="img" aria-label="走一圈四条边">
  <rect width="960" height="540" rx="28" fill="#fff7fb"/>
  <text x="48" y="54" fill="#a13f6c" font-size="32" font-weight="800" font-family="system-ui,'PingFang SC','Noto Sans SC','Hiragino Sans',sans-serif">走一圈四条边</text>
  <rect x="310" y="90" width="340" height="300" rx="16" fill="#ffe4ee" stroke="#c83f79" stroke-width="6"/>
  <circle cx="480" cy="185" r="32" fill="#c83f79"/>
  <ellipse cx="480" cy="290" rx="70" ry="78" fill="#c83f79"/>
  <g font-family="system-ui,'PingFang SC','Noto Sans SC','Hiragino Sans',sans-serif" fill="#a13f6c" font-size="20" font-weight="700">
    <text x="70" y="140">头顶</text>
    <text x="70" y="170" fill="#59364b" font-size="16" font-weight="400">不要切到头骨。</text>
    <text x="680" y="180">视线</text>
    <text x="680" y="210" fill="#59364b" font-size="16" font-weight="400">往哪看就往哪留空。</text>
    <text x="70" y="360">关节</text>
    <text x="70" y="390" fill="#59364b" font-size="16" font-weight="400">不要切手腕、膝盖。</text>
    <text x="680" y="360">边缘</text>
    <text x="680" y="390" fill="#59364b" font-size="16" font-weight="400">不要半截物体贴边。</text>
  </g>
<text x="48" y="500" fill="#876579" font-size="18" font-family="system-ui,'PingFang SC','Noto Sans SC','Hiragino Sans',sans-serif">导出，再打开，放到 100%。裁剪预览很小。</text>
</svg>
