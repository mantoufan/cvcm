    <text x="80" y="280" fill="#c83f79" font-size="36" font-weight="800">→ 10 files · ZIP</text>
  </g>
<text x="48" y="500" fill="#876579" font-size="18" font-family="system-ui,'PingFang SC','Noto Sans SC','Hiragino Sans',sans-serif">加密 PDF 要先解锁再拆。</text>
