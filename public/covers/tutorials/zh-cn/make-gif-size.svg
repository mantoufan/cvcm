<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" role="img" aria-label="宽度、帧数和颜色数决定文件大小。">
  <rect width="960" height="540" rx="28" fill="#fff7fb"/>
  <text x="480" y="90" fill="#a13f6c" font-size="30" font-weight="800" text-anchor="middle" font-family="system-ui,'PingFang SC','Noto Sans SC','Hiragino Sans',sans-serif">文件大小 ∝ 像素 × 帧数</text><rect x="90" y="140" width="320" height="180" rx="18" fill="#ffe4ee" stroke="#c83f79" stroke-width="3"/><text x="250" y="360" fill="#59364b" font-size="24" font-weight="700" text-anchor="middle" font-family="ui-monospace,Menlo,Consolas,monospace">480 px</text><rect x="490" y="185" width="160" height="90" rx="18" fill="#ffe4ee" stroke="#c83f79" stroke-width="3"/><text x="570" y="360" fill="#59364b" font-size="24" font-weight="700" text-anchor="middle" font-family="ui-monospace,Menlo,Consolas,monospace">240 px</text><text x="250" y="400" fill="#876579" font-size="22" font-weight="400" text-anchor="middle" font-family="ui-monospace,Menlo,Consolas,monospace">100 %</text><text x="570" y="400" fill="#c83f79" font-size="22" font-weight="800" text-anchor="middle" font-family="ui-monospace,Menlo,Consolas,monospace">≈ 25 %</text><rect x="700" y="140" width="190" height="180" rx="18" fill="#ffffff" stroke="#f2d9e5" stroke-width="3"/><text x="795" y="125" fill="#a13f6c" font-size="22" font-weight="800" text-anchor="middle" font-family="system-ui,'PingFang SC','Noto Sans SC','Hiragino Sans',sans-serif">颜色数</text><text x="795" y="195" fill="#59364b" font-size="26" font-weight="700" text-anchor="middle" font-family="ui-monospace,Menlo,Consolas,monospace">256</text><text x="795" y="245" fill="#876579" font-size="26" font-weight="400" text-anchor="middle" font-family="ui-monospace,Menlo,Consolas,monospace">64</text><text x="795" y="295" fill="#876579" font-size="26" font-weight="400" text-anchor="middle" font-family="ui-monospace,Menlo,Consolas,monospace">16</text><text x="795" y="360" fill="#c83f79" font-size="22" font-weight="800" text-anchor="middle" font-family="system-ui,'PingFang SC','Noto Sans SC','Hiragino Sans',sans-serif">↓ 文件大小</text>
</svg>
