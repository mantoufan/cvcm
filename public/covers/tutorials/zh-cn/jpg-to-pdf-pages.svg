<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" role="img" aria-label="导出后数页数">
  <rect width="960" height="540" rx="28" fill="#fff7fb"/>
  <text x="48" y="54" fill="#a13f6c" font-size="32" font-weight="800" font-family="system-ui,'PingFang SC','Noto Sans SC','Hiragino Sans',sans-serif">导出后数页数</text>
  <g font-family="system-ui,'PingFang SC','Noto Sans SC','Hiragino Sans',sans-serif">
    <text x="80" y="180" fill="#59364b" font-size="22">放入 4 张照片</text>
    <text x="80" y="240" fill="#c83f79" font-size="40" font-weight="800">→ 4 页</text>
    <text x="80" y="320" fill="#59364b" font-size="20">只有 3 页，就是有一张没解出来。</text>
    <text x="80" y="370" fill="#59364b" font-size="20">Firefox 里 HEIC 可能失败 — 先转成 JPG。</text>
  </g>
<text x="48" y="500" fill="#876579" font-size="18" font-family="system-ui,'PingFang SC','Noto Sans SC','Hiragino Sans',sans-serif">打开 PDF。不要只看下载提示。</text>
</svg>
