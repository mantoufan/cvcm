<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" role="img" aria-label="打印前先扫">
  <rect width="960" height="540" rx="28" fill="#fff7fb"/>
  <text x="48" y="54" fill="#a13f6c" font-size="32" font-weight="800" font-family="system-ui,'PingFang SC','Noto Sans SC','Hiragino Sans',sans-serif">打印前先扫</text>
  <rect x="80" y="120" width="220" height="300" rx="36" fill="#fff" stroke="#c83f79" stroke-width="6"/>
  <rect x="110" y="160" width="160" height="160" rx="12" fill="#ffe4ee"/>
  <rect x="150" y="360" width="80" height="10" rx="5" fill="#f7b6cb"/>
  <text x="360" y="200" fill="#a13f6c" font-size="24" font-weight="700" font-family="system-ui,'PingFang SC','Noto Sans SC','Hiragino Sans',sans-serif">相机预览</text>
  <text x="360" y="250" fill="#59364b" font-size="20" font-family="system-ui,'PingFang SC','Noto Sans SC','Hiragino Sans',sans-serif">手机离 20–30 厘米。</text>
  <text x="360" y="300" fill="#59364b" font-size="20" font-family="system-ui,'PingFang SC','Noto Sans SC','Hiragino Sans',sans-serif">必须打开页面，不要跳出搜索。</text>
  <text x="360" y="350" fill="#59364b" font-size="20" font-family="system-ui,'PingFang SC','Noto Sans SC','Hiragino Sans',sans-serif">静区：四周留白边。</text>
  <text x="360" y="400" fill="#59364b" font-size="20" font-family="system-ui,'PingFang SC','Noto Sans SC','Hiragino Sans',sans-serif">边长至少 2 厘米。不要拉扁。</text>
<text x="48" y="500" fill="#876579" font-size="18" font-family="system-ui,'PingFang SC','Noto Sans SC','Hiragino Sans',sans-serif">厨房里扫不开，门口也扫不开。</text>
</svg>
