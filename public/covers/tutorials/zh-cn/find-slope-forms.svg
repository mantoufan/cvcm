<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" role="img" aria-label="同一条直线的三种写法。">
  <rect width="960" height="540" rx="28" fill="#fff7fb"/>
  <text x="480" y="80" fill="#876579" font-size="26" font-weight="400" text-anchor="middle" font-family="ui-monospace,Menlo,Consolas,monospace">(1, 2) · (4, 8) · m = 2</text><rect x="110" y="120" width="740" height="100" rx="18" fill="#ffffff" stroke="#f2d9e5" stroke-width="3"/><text x="290" y="178" fill="#a13f6c" font-size="22" font-weight="800" text-anchor="middle" font-family="system-ui,'PingFang SC','Noto Sans SC','Hiragino Sans',sans-serif">斜截式</text><text x="650" y="182" fill="#59364b" font-size="34" font-weight="800" text-anchor="middle" font-family="ui-monospace,Menlo,Consolas,monospace">y = 2x</text><rect x="110" y="250" width="740" height="100" rx="18" fill="#ffffff" stroke="#f2d9e5" stroke-width="3"/><text x="290" y="308" fill="#a13f6c" font-size="22" font-weight="800" text-anchor="middle" font-family="system-ui,'PingFang SC','Noto Sans SC','Hiragino Sans',sans-serif">点斜式</text><text x="650" y="312" fill="#59364b" font-size="34" font-weight="800" text-anchor="middle" font-family="ui-monospace,Menlo,Consolas,monospace">y − 2 = 2(x − 1)</text><rect x="110" y="380" width="740" height="100" rx="18" fill="#ffffff" stroke="#f2d9e5" stroke-width="3"/><text x="290" y="438" fill="#a13f6c" font-size="22" font-weight="800" text-anchor="middle" font-family="system-ui,'PingFang SC','Noto Sans SC','Hiragino Sans',sans-serif">一般式</text><text x="650" y="442" fill="#59364b" font-size="34" font-weight="800" text-anchor="middle" font-family="ui-monospace,Menlo,Consolas,monospace">2x − y = 0</text>
</svg>
