<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" role="img" aria-label="列表顺序就是页序">
  <rect width="960" height="540" rx="28" fill="#fff7fb"/>
  <text x="48" y="54" fill="#a13f6c" font-size="32" font-weight="800" font-family="system-ui,'PingFang SC','Noto Sans SC','Hiragino Sans',sans-serif">列表顺序就是页序</text>
  <g font-family="system-ui,'PingFang SC','Noto Sans SC','Hiragino Sans',sans-serif" font-size="22" fill="#59364b">
    <rect x="70" y="120" width="360" height="80" rx="16" fill="#ffe4ee" stroke="#c83f79" stroke-width="3"/>
    <text x="100" y="170">1  封面.pdf</text>
    <rect x="70" y="220" width="360" height="80" rx="16" fill="#fff" stroke="#f2d9e5" stroke-width="3"/>
    <text x="100" y="270">2  合同.pdf</text>
    <rect x="70" y="320" width="360" height="80" rx="16" fill="#fff" stroke="#f2d9e5" stroke-width="3"/>
    <text x="100" y="370">3  附录.pdf</text>
    <text x="500" y="200" fill="#a13f6c" font-size="24" font-weight="700">拖动调整顺序</text>
    <text x="500" y="250" font-size="18">第一行就是第 1 页。</text>
    <text x="500" y="295" font-size="18">源文件里的空白页还在。</text>
    <text x="500" y="340" font-size="18">导出后核对页数。</text>
  </g>
<text x="48" y="500" fill="#876579" font-size="18" font-family="system-ui,'PingFang SC','Noto Sans SC','Hiragino Sans',sans-serif">第 1 页不对，是列表错了，不是下载坏了。</text>
</svg>
