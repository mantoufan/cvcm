<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" role="img" aria-label="方量 = 长 × 宽 × 厚，全部以英尺计。">
  <rect width="960" height="540" rx="28" fill="#fff7fb"/>
  <g transform="translate(130 0)"><path d="M180 300 L520 300 L700 200 L360 200 Z" fill="#efe7eb" stroke="#b9a3ae" stroke-width="3"/><path d="M180 300 L520 300 L520 340 L180 340 Z" fill="#ddd2d8" stroke="#b9a3ae" stroke-width="3"/><path d="M520 300 L700 200 L700 240 L520 340 Z" fill="#cfc2c9" stroke="#b9a3ae" stroke-width="3"/></g><text x="480" y="385" fill="#59364b" font-size="22" font-weight="700" text-anchor="middle" font-family="system-ui,'PingFang SC','Noto Sans SC','Hiragino Sans',sans-serif">长度 10 ft</text><text x="745" y="300" fill="#59364b" font-size="22" font-weight="700" text-anchor="start" font-family="system-ui,'PingFang SC','Noto Sans SC','Hiragino Sans',sans-serif">宽度 10 ft</text><line x1="290" y1="300" x2="290" y2="340" stroke="#c83f79" stroke-width="4" stroke-linecap="round"/><text x="278" y="328" fill="#c83f79" font-size="22" font-weight="800" text-anchor="end" font-family="system-ui,'PingFang SC','Noto Sans SC','Hiragino Sans',sans-serif">厚度 4 in</text><text x="480" y="90" fill="#876579" font-size="26" font-weight="400" text-anchor="middle" font-family="ui-monospace,Menlo,Consolas,monospace">4 in = 4 ÷ 12 = 0.333 ft</text><text x="480" y="140" fill="#59364b" font-size="28" font-weight="700" text-anchor="middle" font-family="ui-monospace,Menlo,Consolas,monospace">10 × 10 × 0.333 = 33.3 ft³</text><text x="480" y="460" fill="#a13f6c" font-size="32" font-weight="800" text-anchor="middle" font-family="ui-monospace,Menlo,Consolas,monospace">33.3 ÷ 27 = 1.23 yd³</text>
</svg>
