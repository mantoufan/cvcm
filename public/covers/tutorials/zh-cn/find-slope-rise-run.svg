<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" role="img" aria-label="斜率是两点之间纵向变化与横向变化之比。">
  <rect width="960" height="540" rx="28" fill="#fff7fb"/>
  <line x1="120" y1="470" x2="860" y2="470" stroke="#b9a3ae" stroke-width="2" stroke-linecap="round"/><line x1="200" y1="40" x2="200" y2="500" stroke="#b9a3ae" stroke-width="2" stroke-linecap="round"/><line x1="190.4" y1="489.2" x2="420.79999999999995" y2="28.400000000000034" stroke="#c83f79" stroke-width="5" stroke-linecap="round"/><path d="M248 374 H392 V86" fill="none" stroke="#876579" stroke-width="3" stroke-dasharray="10 7"/><circle cx="248" cy="374" r="10" fill="#a13f6c"/><text x="232" y="360" fill="#59364b" font-size="22" font-weight="800" text-anchor="end" font-family="ui-monospace,Menlo,Consolas,monospace">(1, 2)</text><circle cx="392" cy="86" r="10" fill="#a13f6c"/><text x="376" y="72" fill="#59364b" font-size="22" font-weight="800" text-anchor="end" font-family="ui-monospace,Menlo,Consolas,monospace">(4, 8)</text><text x="320.0" y="408" fill="#59364b" font-size="22" font-weight="700" text-anchor="middle" font-family="ui-monospace,Menlo,Consolas,monospace">横向变化 = 4 − 1 = 3</text><text x="410" y="230.0" fill="#59364b" font-size="22" font-weight="700" text-anchor="start" font-family="ui-monospace,Menlo,Consolas,monospace">纵向变化 = 8 − 2 = 6</text><rect x="560" y="330" width="300" height="110" rx="18" fill="#ffe4ee" stroke="#c83f79" stroke-width="3"/><text x="710" y="375" fill="#a13f6c" font-size="24" font-weight="800" text-anchor="middle" font-family="ui-monospace,Menlo,Consolas,monospace">m = 纵向变化 / 横向变化</text><text x="710" y="418" fill="#a13f6c" font-size="26" font-weight="800" text-anchor="middle" font-family="ui-monospace,Menlo,Consolas,monospace">= 6 / 3 = 2</text>
</svg>
