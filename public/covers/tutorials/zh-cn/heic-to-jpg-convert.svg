  </g>
<text x="48" y="500" fill="#876579" font-size="18" font-family="system-ui,'PingFang SC','Noto Sans SC','Hiragino Sans',sans-serif">预览空白，就是这款浏览器解不了 HEIC。换 Safari 或 Chrome。</text>
</svg>
