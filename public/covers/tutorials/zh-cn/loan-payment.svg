  <text x="664" y="246" fill="#59364b" font-size="16" font-family="system-ui,'PingFang SC','Noto Sans SC','Hiragino Sans',sans-serif">10000、年利率 12%、1 年。余额逐月下降。</text>
<text x="80" y="470" fill="#876579" font-size="18" font-family="system-ui,'PingFang SC','Noto Sans SC','Hiragino Sans',sans-serif">10000、年利率 12%、1 年。余额逐月下降。</text>
