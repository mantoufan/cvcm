<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" role="img" aria-label="怎么缩放或压缩图片">
  <rect width="1280" height="720" rx="28" fill="#fff7fb"/>
  <text x="48" y="54" fill="#a13f6c" font-size="32" font-weight="800" font-family="system-ui,'PingFang SC','Noto Sans SC','Hiragino Sans',sans-serif">怎么缩放或压缩图片</text>
  <g font-family="system-ui,'PingFang SC','Noto Sans SC','Hiragino Sans',sans-serif">
    <rect x="100" y="170" width="420" height="320" rx="22" fill="#fff" stroke="#f7b6cb" stroke-width="4"/>
    <text x="140" y="260" fill="#a13f6c" font-size="28" font-weight="700">像素</text>
    <text x="140" y="320" fill="#59364b" font-size="22">4000 × 3000</text>
    <rect x="620" y="170" width="520" height="320" rx="22" fill="#ffe4ee" stroke="#c83f79" stroke-width="4"/>
    <text x="660" y="260" fill="#a13f6c" font-size="28" font-weight="700">体积</text>
    <text x="660" y="320" fill="#59364b" font-size="22">2.4 MB → 380 KB</text>
  </g>
<text x="100" y="620" fill="#876579" font-size="18" font-family="system-ui,'PingFang SC','Noto Sans SC','Hiragino Sans',sans-serif">4000 像素仍可能很大。先写下真实上限。</text>
</svg>
