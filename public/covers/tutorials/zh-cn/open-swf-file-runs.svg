las,monospace">SWF</text><text x="146" y="420" fill="#59364b" font-size="24" font-weight="400" text-anchor="start" font-family="system-ui,'PingFang SC','Noto Sans SC','Hiragino Sans',sans-serif">只认原来的网站</text><rect x="680" y="350" width="230" height="120" rx="14" fill="#ffffff" stroke="#876579" stroke-width="3"/><text x="795" y="422" fill="#876579" font-size="28" font-weight="700" text-anchor="middle" font-family="system-ui,'PingFang SC','Noto Sans SC','Hiragino Sans',sans-serif">会停住</text>
