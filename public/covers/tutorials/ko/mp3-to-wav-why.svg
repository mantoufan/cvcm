<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" role="img" aria-label="WAV는 비압축. MP3는 이미 버린 데이터가 있습니다.">
  <rect width="960" height="540" rx="28" fill="#fff7fb"/>
  <text x="48" y="54" fill="#a13f6c" font-size="24" font-weight="800" font-family="system-ui,'PingFang SC','Noto Sans SC','Hiragino Sans',sans-serif">WAV는 비압축. MP3는 이미 버린 데이터가 있습니다.</text>
  <rect x="70" y="130" width="820" height="220" rx="22" fill="#ffe4ee" stroke="#c83f79" stroke-width="3"/>
  <text x="98" y="178" fill="#a13f6c" font-size="24" font-weight="700" font-family="system-ui,'PingFang SC','Noto Sans SC','Hiragino Sans',sans-serif">MP3 → WAV</text>
  <text x="98" y="218" fill="#59364b" font-size="18" font-family="system-ui,'PingFang SC','Noto Sans SC','Hiragino Sans',sans-serif">WAV는 비압축. MP3는 이미 버린 데이터가 있습니다.</text>
<text x="48" y="500" fill="#876579" font-size="18" font-family="system-ui,'PingFang SC','Noto Sans SC','Hiragino Sans',sans-serif">MP3가 버린 것은 안 돌아옵니다. 받은 WAV를 재생하세요.</text>
</svg>
