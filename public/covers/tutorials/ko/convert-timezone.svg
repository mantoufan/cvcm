<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" role="img" aria-label="시간대 변환하는 법">
  <rect width="1280" height="720" rx="28" fill="#fff7fb"/>
  <text x="48" y="54" fill="#a13f6c" font-size="26" font-weight="800" font-family="system-ui,'PingFang SC','Noto Sans SC','Hiragino Sans',sans-serif">시간대 변환하는 법</text>
  <rect x="80" y="150" width="340" height="220" rx="22" fill="#ffffff" stroke="#f2d9e5" stroke-width="3"/>
  <text x="104" y="202" fill="#a13f6c" font-size="22" font-weight="700" font-family="system-ui,'PingFang SC','Noto Sans SC','Hiragino Sans',sans-serif">그들의 시계</text>
  <text x="104" y="246" fill="#59364b" font-size="16" font-family="system-ui,'PingFang SC','Noto Sans SC','Hiragino Sans',sans-serif">출발은 그 시계의 시간대. UTC 순간을 복사. 오프셋을 두 번 더하지 마세요.</text>

  <rect x="460" y="150" width="340" height="220" rx="22" fill="#ffffff" stroke="#f2d9e5" stroke-width="3"/>
  <text x="484" y="202" fill="#a13f6c" font-size="22" font-weight="700" font-family="system-ui,'PingFang SC','Noto Sans SC','Hiragino Sans',sans-serif">1월 −05:00</text>
  <text x="484" y="246" fill="#59364b" font-size="16" font-family="system-ui,'PingFang SC','Noto Sans SC','Hiragino Sans',sans-serif">7월 −04:00</text>

  <rect x="840" y="150" width="360" height="220" rx="22" fill="#ffe4ee" stroke="#c83f79" stroke-width="3"/>
  <text x="864" y="202" fill="#a13f6c" font-size="22" font-weight="700" font-family="system-ui,'PingFang SC','Noto Sans SC','Hiragino Sans',sans-serif">UTC</text>
  <text x="864" y="246" fill="#59364b" font-size="16" font-family="system-ui,'PingFang SC','Noto Sans SC','Hiragino Sans',sans-serif">출발은 그 시계의 시간대. UTC 순간을 복사. 오프셋을 두 번 더하지 마세요.</text>
<text x="80" y="470" fill="#876579" font-size="18" font-family="system-ui,'PingFang SC','Noto Sans SC','Hiragino Sans',sans-serif">출발은 그 시계의 시간대. UTC 순간을 복사. 오프셋을 두 번 더하지 마세요.</text>
