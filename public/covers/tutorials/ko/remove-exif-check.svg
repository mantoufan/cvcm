<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" role="img" aria-label="보낸 파일을 다시 넣기. 두 번째는 깨끗해야 합니다.">
  <rect width="960" height="540" rx="28" fill="#fff7fb"/>
  <text x="48" y="54" fill="#a13f6c" font-size="28" font-weight="800" font-family="system-ui,'PingFang SC','Noto Sans SC','Hiragino Sans',sans-serif">보낸 파일을 다시 넣기. 두 번째는 깨끗해야 합니다.</text>
  <g font-family="system-ui,'PingFang SC','Noto Sans SC','Hiragino Sans',sans-serif" font-size="20" fill="#59364b">
    <rect x="70" y="130" width="820" height="90" rx="18" fill="#ffe4ee" stroke="#c83f79" stroke-width="3"/>
    <text x="100" y="185">1  →  2  →  3</text>
    <text x="80" y="320">보낸 파일을 다시 넣기. 두 번째는 깨끗해야 합니다.</text>
  </g>
<text x="48" y="500" fill="#876579" font-size="18" font-family="system-ui,'PingFang SC','Noto Sans SC','Hiragino Sans',sans-serif">복사본을 보내세요. 핀이 필요하면 원본을 남기세요.</text>
</svg>
