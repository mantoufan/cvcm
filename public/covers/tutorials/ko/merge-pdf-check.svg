<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" role="img" aria-label="합친 파일 확인">
  <rect width="960" height="540" rx="28" fill="#fff7fb"/>
  <text x="48" y="54" fill="#a13f6c" font-size="32" font-weight="800" font-family="system-ui,'PingFang SC','Noto Sans SC','Hiragino Sans',sans-serif">합친 파일 확인</text>
  <g font-family="system-ui,'PingFang SC','Noto Sans SC','Hiragino Sans',sans-serif">
    <rect x="80" y="130" width="800" height="280" rx="24" fill="#fff" stroke="#f7b6cb" stroke-width="3"/>
    <text x="120" y="200" fill="#a13f6c" font-size="26" font-weight="700">받은 파일을 여세요</text>
    <text x="120" y="255" fill="#59364b" font-size="20">3+2+4는 9쪽이어야 합니다.</text>
    <text x="120" y="305" fill="#59364b" font-size="20">각 원본의 첫 쪽을 보세요.</text>
    <text x="120" y="355" fill="#59364b" font-size="20">빠졌다면 암호이거나 안 넣은 것입니다.</text>
  </g>
<text x="48" y="500" fill="#876579" font-size="18" font-family="system-ui,'PingFang SC','Noto Sans SC','Hiragino Sans',sans-serif">한 번 연 뒤에 보내세요.</text>
</svg>
