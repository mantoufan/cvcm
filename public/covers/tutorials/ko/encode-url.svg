<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" role="img" aria-label="URL 인코딩하는 법">
  <rect width="1280" height="720" rx="28" fill="#fff7fb"/>
  <text x="48" y="54" fill="#a13f6c" font-size="24" font-weight="800" font-family="system-ui,'PingFang SC','Noto Sans SC','Hiragino Sans',sans-serif">URL 인코딩하는 법</text>
  <rect x="80" y="150" width="340" height="220" rx="22" fill="#ffffff" stroke="#f2d9e5" stroke-width="3"/>
  <text x="104" y="202" fill="#a13f6c" font-size="22" font-weight="700" font-family="system-ui,'PingFang SC','Noto Sans SC','Hiragino Sans',sans-serif">공백 = %20</text>
  <text x="104" y="246" fill="#59364b" font-size="16" font-family="system-ui,'PingFang SC','Noto Sans SC','Hiragino Sans',sans-serif">주소가 열려야 하면 값만 인코딩.</text>

  <rect x="460" y="150" width="340" height="220" rx="22" fill="#ffffff" stroke="#f2d9e5" stroke-width="3"/>
  <text x="484" y="202" fill="#a13f6c" font-size="22" font-weight="700" font-family="system-ui,'PingFang SC','Noto Sans SC','Hiragino Sans',sans-serif">슬래시 = %2F</text>
  <text x="484" y="246" fill="#59364b" font-size="16" font-family="system-ui,'PingFang SC','Noto Sans SC','Hiragino Sans',sans-serif">주소가 열려야 하면 값만 인코딩.</text>

  <rect x="840" y="150" width="360" height="220" rx="22" fill="#ffe4ee" stroke="#c83f79" stroke-width="3"/>
  <text x="864" y="202" fill="#a13f6c" font-size="22" font-weight="700" font-family="system-ui,'PingFang SC','Noto Sans SC','Hiragino Sans',sans-serif">+는 공백으로</text>
  <text x="864" y="246" fill="#59364b" font-size="16" font-family="system-ui,'PingFang SC','Noto Sans SC','Hiragino Sans',sans-serif">주소가 열려야 하면 값만 인코딩.</text>
<text x="80" y="470" fill="#876579" font-size="18" font-family="system-ui,'PingFang SC','Noto Sans SC','Hiragino Sans',sans-serif">주소가 열려야 하면 값만 인코딩.</text>
</svg>
