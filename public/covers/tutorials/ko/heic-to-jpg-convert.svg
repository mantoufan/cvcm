<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" role="img" aria-label="파일을 넣고 JPG를 고른 뒤 받기">
  <rect width="960" height="540" rx="28" fill="#fff7fb"/>
  <text x="48" y="54" fill="#a13f6c" font-size="28" font-weight="800" font-family="system-ui,'PingFang SC','Noto Sans SC','Hiragino Sans',sans-serif">파일을 넣고 JPG를 고른 뒤 받기</text>
  <g font-family="system-ui,'PingFang SC','Noto Sans SC','Hiragino Sans',sans-serif" font-size="20" fill="#59364b">
    <rect x="70" y="120" width="820" height="90" rx="18" fill="#ffe4ee" stroke="#c83f79" stroke-width="3"/>
    <text x="100" y="175">1  Safari 또는 Chrome에서 cv.cm</text>
    <rect x="70" y="230" width="820" height="90" rx="18" fill="#fff" stroke="#f2d9e5" stroke-width="3"/>
    <text x="100" y="285">2  .HEIC를 넣고 JPG 선택</text>
    <rect x="70" y="340" width="820" height="90" rx="18" fill="#fff" stroke="#f2d9e5" stroke-width="3"/>
