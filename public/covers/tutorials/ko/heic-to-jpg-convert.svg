<text x="48" y="500" fill="#876579" font-size="18" font-family="system-ui,'PingFang SC','Noto Sans SC','Hiragino Sans',sans-serif">미리보기가 비면 이 브라우저는 HEIC를 못 엽니다. 바꾸세요.</text>
</svg>
