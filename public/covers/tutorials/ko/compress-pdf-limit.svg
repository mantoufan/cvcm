<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" role="img" aria-label="실제 한도에 맞추기">
  <rect width="960" height="540" rx="28" fill="#fff7fb"/>
  <text x="48" y="54" fill="#a13f6c" font-size="28" font-weight="800" font-family="system-ui,'PingFang SC','Noto Sans SC','Hiragino Sans',sans-serif">실제 한도에 맞추기</text>
  <rect x="50" y="110" width="270" height="300" rx="22" fill="#ffe4ee" stroke="#c83f79" stroke-width="3"/>
  <text x="72" y="150" fill="#a13f6c" font-size="22" font-weight="700" font-family="system-ui,'PingFang SC','Noto Sans SC','Hiragino Sans',sans-serif">이메일</text>
  <text x="72" y="182" fill="#59364b" font-size="18" font-family="system-ui,'PingFang SC','Noto Sans SC','Hiragino Sans',sans-serif"><tspan x="72" dy="0">보통 10–25MB.</tspan><tspan x="72" dy="22">압축한 뒤 첨부.</tspan><tspan x="72" dy="22">attach once.</tspan></text>

  <rect x="345" y="110" width="270" height="300" rx="22" fill="#ffffff" stroke="#f2d9e5" stroke-width="3"/>
  <text x="367" y="150" fill="#a13f6c" font-size="22" font-weight="700" font-family="system-ui,'PingFang SC','Noto Sans SC','Hiragino Sans',sans-serif">폼 업로드</text>
  <text x="367" y="182" fill="#59364b" font-size="18" font-family="system-ui,'PingFang SC','Noto Sans SC','Hiragino Sans',sans-serif"><tspan x="367" dy="0">칸을 읽으세요.</tspan><tspan x="367" dy="22">2MB인 곳도 있습니다.</tspan><tspan x="367" dy="22">20인 곳도.</tspan></text>

  <rect x="640" y="110" width="270" height="300" rx="22" fill="#ffffff" stroke="#f2d9e5" stroke-width="3"/>
  <text x="662" y="150" fill="#a13f6c" font-size="22" font-weight="700" font-family="system-ui,'PingFang SC','Noto Sans SC','Hiragino Sans',sans-serif">너무 뭉갬</text>
  <text x="662" y="182" fill="#59364b" font-size="18" font-family="system-ui,'PingFang SC','Noto Sans SC','Hiragino Sans',sans-serif"><tspan x="662" dy="0">JPEG을 덜 누르세요.</tspan><tspan x="662" dy="22">또는 PDF를 나누세요.</tspan><tspan x="662" dy="22">Or split the PDF.</tspan></text>
<text x="48" y="500" fill="#876579" font-size="18" font-family="system-ui,'PingFang SC','Noto Sans SC','Hiragino Sans',sans-serif">못 읽는 작은 파일은 성공이 아닙니다.</text>
</svg>
