<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" role="img" aria-label="같은 피사체, 세 비율">
  <rect width="960" height="540" rx="28" fill="#fff7fb"/>
  <text x="48" y="54" fill="#a13f6c" font-size="32" font-weight="800" font-family="system-ui,'PingFang SC','Noto Sans SC','Hiragino Sans',sans-serif">같은 피사체, 세 비율</text>
  <g font-family="system-ui,'PingFang SC','Noto Sans SC','Hiragino Sans',sans-serif">
    <rect x="50" y="100" width="240" height="240" rx="16" fill="#ffe4ee" stroke="#c83f79" stroke-width="4"/>
    <circle cx="170" cy="175" r="28" fill="#c83f79"/>
    <ellipse cx="170" cy="255" rx="55" ry="62" fill="#c83f79"/>
    <text x="70" y="380" fill="#a13f6c" font-size="20" font-weight="700">1:1 아바타</text>
    <rect x="340" y="80" width="220" height="275" rx="16" fill="#ffe4ee" stroke="#c83f79" stroke-width="4"/>
    <circle cx="450" cy="165" r="28" fill="#c83f79"/>
    <ellipse cx="450" cy="255" rx="55" ry="70" fill="#c83f79"/>
    <text x="360" y="400" fill="#a13f6c" font-size="20" font-weight="700">4:5 피드</text>
    <rect x="610" y="145" width="300" height="170" rx="16" fill="#ffe4ee" stroke="#c83f79" stroke-width="4"/>
    <circle cx="760" cy="200" r="24" fill="#c83f79"/>
    <ellipse cx="760" cy="268" rx="70" ry="38" fill="#c83f79"/>
    <text x="630" y="360" fill="#a13f6c" font-size="20" font-weight="700">16:9 커버</text>
  </g>
<text x="48" y="500" fill="#876579" font-size="18" font-family="system-ui,'PingFang SC','Noto Sans SC','Hiragino Sans',sans-serif">피드은 흔히 4:5. 스토리는 9:16. 아바타는 1:1.</text>
</svg>
