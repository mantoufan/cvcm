<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" role="img" aria-label="투명이면 WebP. JPG는 메웁니다.">
  <rect width="960" height="540" rx="28" fill="#fff7fb"/>
  <text x="48" y="54" fill="#a13f6c" font-size="24" font-weight="800" font-family="system-ui,'PingFang SC','Noto Sans SC','Hiragino Sans',sans-serif">투명이면 WebP. JPG는 메웁니다.</text>
  <rect x="70" y="130" width="820" height="220" rx="22" fill="#ffe4ee" stroke="#c83f79" stroke-width="3"/>
  <text x="98" y="178" fill="#a13f6c" font-size="24" font-weight="700" font-family="system-ui,'PingFang SC','Noto Sans SC','Hiragino Sans',sans-serif">WebP ≠ JPG</text>
  <text x="98" y="218" fill="#59364b" font-size="18" font-family="system-ui,'PingFang SC','Noto Sans SC','Hiragino Sans',sans-serif">투명이면 WebP. JPG는 메웁니다.</text>
<text x="48" y="500" fill="#876579" font-size="18" font-family="system-ui,'PingFang SC','Noto Sans SC','Hiragino Sans',sans-serif">WebP는 투명을 남깁니다. JPG는 안 됩니다. 옛 서류는 아직 PNG일 수 있습니다.</text>
</svg>
