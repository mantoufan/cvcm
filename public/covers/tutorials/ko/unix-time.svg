<text x="80" y="480" fill="#876579" font-size="18" font-family="system-ui,'PingFang SC','Noto Sans SC','Hiragino Sans',sans-serif">ISO와 로컬을 읽으세요. 연도가 이상하면 자릿수가 틀립니다.</text>
