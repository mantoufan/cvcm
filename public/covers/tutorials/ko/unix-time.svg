  <text x="108" y="236" fill="#59364b" font-size="18" font-family="system-ui,'PingFang SC','Noto Sans SC','Hiragino Sans',sans-serif">초</text>

  <rect x="460" y="140" width="340" height="240" rx="22" fill="#ffffff" stroke="#f2d9e5" stroke-width="3"/>
