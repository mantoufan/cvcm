  <text x="664" y="246" fill="#59364b" font-size="16" font-family="system-ui,'PingFang SC','Noto Sans SC','Hiragino Sans',sans-serif">10000, 연 12%, 1년. 잔액은 매달 줄어듭니다.</text>
