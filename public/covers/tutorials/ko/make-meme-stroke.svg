<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" role="img" aria-label="테두리가 글자를 읽히게 함">
  <rect width="960" height="540" rx="28" fill="#fff7fb"/>
  <text x="48" y="54" fill="#a13f6c" font-size="28" font-weight="800" font-family="system-ui,'PingFang SC','Noto Sans SC','Hiragino Sans',sans-serif">테두리가 글자를 읽히게 함</text>
  <g font-family="system-ui,'PingFang SC','Noto Sans SC','Hiragino Sans',sans-serif">
    <text x="80" y="240" fill="#fff" stroke="#a13f6c" stroke-width="8" font-size="40" font-weight="800">테두리가 글자를 읽히게 함</text>
  </g>
<text x="48" y="500" fill="#876579" font-size="18" font-family="system-ui,'PingFang SC','Noto Sans SC','Hiragino Sans',sans-serif">짧게. 테두리. 얼굴을 가리지 마세요.</text>
