<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" role="img" aria-label="A4 대 사진에 맞춤">
  <rect width="960" height="540" rx="28" fill="#fff7fb"/>
  <text x="48" y="54" fill="#a13f6c" font-size="32" font-weight="800" font-family="system-ui,'PingFang SC','Noto Sans SC','Hiragino Sans',sans-serif">A4 대 사진에 맞춤</text>
  <rect x="60" y="110" width="400" height="310" rx="22" fill="#ffe4ee" stroke="#c83f79" stroke-width="3"/>
  <text x="82" y="150" fill="#a13f6c" font-size="22" font-weight="700" font-family="system-ui,'PingFang SC','Noto Sans SC','Hiragino Sans',sans-serif">A4 / Letter</text>
  <text x="82" y="182" fill="#59364b" font-size="18" font-family="system-ui,'PingFang SC','Noto Sans SC','Hiragino Sans',sans-serif"><tspan x="82" dy="0">서류와 프린터.</tspan><tspan x="82" dy="22">사진에 여백.</tspan><tspan x="82" dy="22">숙제에 쓰세요.</tspan></text>

  <rect x="500" y="110" width="400" height="310" rx="22" fill="#ffffff" stroke="#f2d9e5" stroke-width="3"/>
  <text x="522" y="150" fill="#a13f6c" font-size="22" font-weight="700" font-family="system-ui,'PingFang SC','Noto Sans SC','Hiragino Sans',sans-serif">사진에 맞춤</text>
  <text x="522" y="182" fill="#59364b" font-size="18" font-family="system-ui,'PingFang SC','Noto Sans SC','Hiragino Sans',sans-serif"><tspan x="522" dy="0">한 장이 페이지를 채움.</tspan><tspan x="522" dy="22">룩북에 나음.</tspan><tspan x="522" dy="22">사무 프린터엔 나쁨.</tspan></text>
<text x="48" y="500" fill="#876579" font-size="18" font-family="system-ui,'PingFang SC','Noto Sans SC','Hiragino Sans',sans-serif">가장자리가 잘리면 A4 작업에 맞춤을 고른 것입니다.</text>
</svg>
