<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" role="img" aria-label="인쇄 전에 스캔">
  <rect width="960" height="540" rx="28" fill="#fff7fb"/>
  <text x="48" y="54" fill="#a13f6c" font-size="32" font-weight="800" font-family="system-ui,'PingFang SC','Noto Sans SC','Hiragino Sans',sans-serif">인쇄 전에 스캔</text>
  <rect x="80" y="120" width="220" height="300" rx="36" fill="#fff" stroke="#c83f79" stroke-width="6"/>
  <rect x="110" y="160" width="160" height="160" rx="12" fill="#ffe4ee"/>
  <rect x="150" y="360" width="80" height="10" rx="5" fill="#f7b6cb"/>
  <text x="360" y="200" fill="#a13f6c" font-size="24" font-weight="700" font-family="system-ui,'PingFang SC','Noto Sans SC','Hiragino Sans',sans-serif">카메라</text>
  <text x="360" y="250" fill="#59364b" font-size="20" font-family="system-ui,'PingFang SC','Noto Sans SC','Hiragino Sans',sans-serif">20–30cm 떨어뜨리세요.</text>
  <text x="360" y="300" fill="#59364b" font-size="20" font-family="system-ui,'PingFang SC','Noto Sans SC','Hiragino Sans',sans-serif">페이지가 열려야 합니다. 검색창이면 실패.</text>
  <text x="360" y="350" fill="#59364b" font-size="20" font-family="system-ui,'PingFang SC','Noto Sans SC','Hiragino Sans',sans-serif">흰 여백을 남기세요.</text>
  <text x="360" y="400" fill="#59364b" font-size="20" font-family="system-ui,'PingFang SC','Noto Sans SC','Hiragino Sans',sans-serif">한 변 2cm 이상. 늘리지 마세요.</text>
<text x="48" y="500" fill="#876579" font-size="18" font-family="system-ui,'PingFang SC','Noto Sans SC','Hiragino Sans',sans-serif">부엌에서 실패하면 문에서도 실패합니다.</text>
</svg>
