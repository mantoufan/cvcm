<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" role="img" aria-label="필요한 숫자를 정하기">
  <rect width="960" height="540" rx="28" fill="#fff7fb"/>
  <text x="48" y="54" fill="#a13f6c" font-size="28" font-weight="800" font-family="system-ui,'PingFang SC','Noto Sans SC','Hiragino Sans',sans-serif">필요한 숫자를 정하기</text>
  <g font-family="system-ui,'PingFang SC','Noto Sans SC','Hiragino Sans',sans-serif" font-size="22" fill="#59364b">
    <text x="80" y="180">단어</text>
    <text x="80" y="240">글자</text>
    <text x="80" y="300">공백 없음</text>
  </g>
<text x="48" y="500" fill="#876579" font-size="18" font-family="system-ui,'PingFang SC','Noto Sans SC','Hiragino Sans',sans-serif">세 일, 세 숫자. 중국어 숙제는 공백 없는 글자.</text>
</svg>
