<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" role="img" aria-label="자수는 공백 없는 글자. 단어를 쓰지 마세요.">
  <rect width="960" height="540" rx="28" fill="#fff7fb"/>
  <text x="48" y="54" fill="#a13f6c" font-size="26" font-weight="800" font-family="system-ui,'PingFang SC','Noto Sans SC','Hiragino Sans',sans-serif">자수는 공백 없는 글자. 단어를 쓰지 마세요.</text>
  <g font-family="system-ui,'PingFang SC','Noto Sans SC','Hiragino Sans',sans-serif">
    <rect x="70" y="140" width="820" height="220" rx="20" fill="#fff" stroke="#f7b6cb" stroke-width="3"/>
    <text x="100" y="260" fill="#59364b" font-size="22">자수는 공백 없는 글자. 단어를 쓰지 마세요.</text>
  </g>
<text x="48" y="500" fill="#876579" font-size="18" font-family="system-ui,'PingFang SC','Noto Sans SC','Hiragino Sans',sans-serif">세 일, 세 숫자. 중국어 숙제는 공백 없는 글자.</text>
