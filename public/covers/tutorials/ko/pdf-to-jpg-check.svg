<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" role="img" aria-label="한 쪽을 100%로 열기">
  <rect width="960" height="540" rx="28" fill="#fff7fb"/>
  <text x="48" y="54" fill="#a13f6c" font-size="32" font-weight="800" font-family="system-ui,'PingFang SC','Noto Sans SC','Hiragino Sans',sans-serif">한 쪽을 100%로 열기</text>
  <g font-family="system-ui,'PingFang SC','Noto Sans SC','Hiragino Sans',sans-serif" fill="#59364b" font-size="20">
    <rect x="70" y="130" width="820" height="260" rx="22" fill="#fff" stroke="#f7b6cb" stroke-width="3"/>
    <text x="110" y="200">100%로 본문 한 줄을 읽으세요.</text>
    <text x="110" y="250">표의 숫자가 뭉개지면 2×와 PNG.</text>
    <text x="110" y="300">모든 쪽 ZIP이 하나씩 저장보다 쉽습니다.</text>
  </g>
<text x="48" y="500" fill="#876579" font-size="18" font-family="system-ui,'PingFang SC','Noto Sans SC','Hiragino Sans',sans-serif">썸네일은 괜찮은데 원본은 아닐 수 있습니다.</text>
</svg>
