<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" role="img" aria-label="보낸 뒤 쪽수 세기">
  <rect width="960" height="540" rx="28" fill="#fff7fb"/>
  <text x="48" y="54" fill="#a13f6c" font-size="32" font-weight="800" font-family="system-ui,'PingFang SC','Noto Sans SC','Hiragino Sans',sans-serif">보낸 뒤 쪽수 세기</text>
  <g font-family="system-ui,'PingFang SC','Noto Sans SC','Hiragino Sans',sans-serif">
    <text x="80" y="180" fill="#59364b" font-size="22">사진 4장</text>
    <text x="80" y="240" fill="#c83f79" font-size="40" font-weight="800">→ 4쪽</text>
    <text x="80" y="320" fill="#59364b" font-size="20">3쪽이면 한 장이 풀리지 않은 것입니다.</text>
    <text x="80" y="370" fill="#59364b" font-size="20">Firefox에서 HEIC는 실패할 수 있습니다. 먼저 JPG로.</text>
  </g>
<text x="48" y="500" fill="#876579" font-size="18" font-family="system-ui,'PingFang SC','Noto Sans SC','Hiragino Sans',sans-serif">PDF를 여세요. 다운로드 토스트만 믿지 마세요.</text>
</svg>
