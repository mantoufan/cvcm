<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" role="img" aria-label="Verify JPG to PDF pages">
  <rect width="960" height="540" rx="28" fill="#fff7fb"/>
  <text x="48" y="54" fill="#a13f6c" font-size="32" font-weight="800" font-family="system-ui,sans-serif">Count pages after export</text>
  <g font-family="system-ui,sans-serif">
    <text x="80" y="180" fill="#59364b" font-size="24">4 photos dropped</text>
    <text x="80" y="240" fill="#c83f79" font-size="40" font-weight="800">→ 4 pages</text>
    <text x="80" y="320" fill="#59364b" font-size="22">If you see 3, one file failed to decode.</text>
    <text x="80" y="370" fill="#59364b" font-size="22">HEIC may fail in Firefox — convert to JPG first.</text>
  </g>
<text x="48" y="500" fill="#876579" font-size="18" font-family="system-ui,sans-serif">Open the PDF. Do not trust the download toast alone.</text>
</svg>
