<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" role="img" aria-label="Pindai sebelum cetak">
  <rect width="960" height="540" rx="28" fill="#fff7fb"/>
  <text x="48" y="54" fill="#a13f6c" font-size="32" font-weight="800" font-family="system-ui,'PingFang SC','Noto Sans SC','Hiragino Sans',sans-serif">Pindai sebelum cetak</text>
  <rect x="80" y="120" width="220" height="300" rx="36" fill="#fff" stroke="#c83f79" stroke-width="6"/>
  <rect x="110" y="160" width="160" height="160" rx="12" fill="#ffe4ee"/>
  <rect x="150" y="360" width="80" height="10" rx="5" fill="#f7b6cb"/>
  <text x="360" y="200" fill="#a13f6c" font-size="24" font-weight="700" font-family="system-ui,'PingFang SC','Noto Sans SC','Hiragino Sans',sans-serif">Pratinjau kamera</text>
  <text x="360" y="250" fill="#59364b" font-size="20" font-family="system-ui,'PingFang SC','Noto Sans SC','Hiragino Sans',sans-serif">Jarak 20–30 cm.</text>
  <text x="360" y="300" fill="#59364b" font-size="20" font-family="system-ui,'PingFang SC','Noto Sans SC','Hiragino Sans',sans-serif">Halaman harus terbuka, bukan kotak pencarian.</text>
  <text x="360" y="350" fill="#59364b" font-size="20" font-family="system-ui,'PingFang SC','Noto Sans SC','Hiragino Sans',sans-serif">Sisakan pinggir putih.</text>
  <text x="360" y="400" fill="#59364b" font-size="20" font-family="system-ui,'PingFang SC','Noto Sans SC','Hiragino Sans',sans-serif">Sisi minimal 2 cm. Jangan diregang.</text>
<text x="48" y="500" fill="#876579" font-size="18" font-family="system-ui,'PingFang SC','Noto Sans SC','Hiragino Sans',sans-serif">Gagal di dapur, gagal di pintu.</text>
</svg>
