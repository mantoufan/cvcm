  <text x="664" y="246" fill="#59364b" font-size="16" font-family="system-ui,'PingFang SC','Noto Sans SC','Hiragino Sans',sans-serif">10000, 12% setahun, 1 tahun. Saldo turun tiap bulan.</text>
