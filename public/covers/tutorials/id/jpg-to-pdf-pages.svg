<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" role="img" aria-label="Hitung halaman setelah ekspor">
  <rect width="960" height="540" rx="28" fill="#fff7fb"/>
  <text x="48" y="54" fill="#a13f6c" font-size="32" font-weight="800" font-family="system-ui,'PingFang SC','Noto Sans SC','Hiragino Sans',sans-serif">Hitung halaman setelah ekspor</text>
  <g font-family="system-ui,'PingFang SC','Noto Sans SC','Hiragino Sans',sans-serif">
    <text x="80" y="180" fill="#59364b" font-size="22">4 foto dimasukkan</text>
    <text x="80" y="240" fill="#c83f79" font-size="40" font-weight="800">→ 4 halaman</text>
    <text x="80" y="320" fill="#59364b" font-size="20">Kalau 3, satu berkas gagal dibaca.</text>
    <text x="80" y="370" fill="#59364b" font-size="20">HEIC bisa gagal di Firefox — ubah ke JPG dulu.</text>
  </g>
<text x="48" y="500" fill="#876579" font-size="18" font-family="system-ui,'PingFang SC','Noto Sans SC','Hiragino Sans',sans-serif">Buka PDF. Jangan percaya toast unduhan saja.</text>
</svg>
