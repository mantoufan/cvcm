<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" role="img" aria-label="Cara gabung audio / gabung MP3">
  <rect width="1280" height="720" rx="28" fill="#fff7fb"/>
  <text x="48" y="54" fill="#a13f6c" font-size="32" font-weight="800" font-family="system-ui,'PingFang SC','Noto Sans SC','Hiragino Sans',sans-serif">Cara gabung audio / gabung MP3</text>
  <g font-family="system-ui,'PingFang SC','Noto Sans SC','Hiragino Sans',sans-serif">
    <rect x="120" y="160" width="280" height="160" rx="20" fill="#ffe4ee" stroke="#c83f79" stroke-width="4"/>
    <text x="260" y="255" text-anchor="middle" fill="#a13f6c" font-size="40" font-weight="800">1</text>
    <text x="430" y="255" fill="#c83f79" font-size="40" font-weight="800">+</text>
    <rect x="500" y="160" width="280" height="160" rx="20" fill="#ffe4ee" stroke="#c83f79" stroke-width="4"/>
    <text x="640" y="255" text-anchor="middle" fill="#a13f6c" font-size="40" font-weight="800">2</text>
    <text x="810" y="255" fill="#c83f79" font-size="40" font-weight="800">→</text>
    <rect x="880" y="160" width="280" height="160" rx="20" fill="#fff" stroke="#f7b6cb" stroke-width="4"/>
    <text x="1020" y="255" text-anchor="middle" fill="#a13f6c" font-size="28" font-weight="800">WAV</text>
  </g>
<text x="80" y="420" fill="#876579" font-size="18" font-family="system-ui,'PingFang SC','Noto Sans SC','Hiragino Sans',sans-serif">Urutan daftar = urutan putar. Minimal dua. Satu WAV.</text>
</svg>
