<text x="80" y="500" fill="#876579" font-size="18" font-family="system-ui,'PingFang SC','Noto Sans SC','Hiragino Sans',sans-serif">Pajak adalah persen subtotal. Buka PDF. Bukan SPT pajak.</text>
