  <text x="864" y="246" fill="#59364b" font-size="16" font-family="system-ui,'PingFang SC','Noto Sans SC','Hiragino Sans',sans-serif">Kedua ujung dihitung. Akhir pekan keluar. Libur Rabu tetap.</text>
<text x="80" y="470" fill="#876579" font-size="18" font-family="system-ui,'PingFang SC','Noto Sans SC','Hiragino Sans',sans-serif">Kedua ujung dihitung. Akhir pekan keluar. Libur Rabu tetap.</text>
