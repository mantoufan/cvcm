  <text x="484" y="246" fill="#59364b" font-size="16" font-family="system-ui,'PingFang SC','Noto Sans SC','Hiragino Sans',sans-serif">Kedua ujung dihitung. Akhir pekan keluar. Libur Rabu tetap.</text>

