<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" role="img" aria-label="WebP lebih kecil dari PNG dan bisa jaga latar tembus.">
  <rect width="960" height="540" rx="28" fill="#fff7fb"/>
  <text x="48" y="54" fill="#a13f6c" font-size="24" font-weight="800" font-family="system-ui,'PingFang SC','Noto Sans SC','Hiragino Sans',sans-serif">WebP lebih kecil dari PNG dan bisa jaga latar tembus.</text>
  <rect x="70" y="120" width="380" height="240" rx="22" fill="#ffffff" stroke="#f2d9e5" stroke-width="3"/>
  <text x="98" y="168" fill="#a13f6c" font-size="24" font-weight="700" font-family="system-ui,'PingFang SC','Noto Sans SC','Hiragino Sans',sans-serif">PNG</text>
  <text x="98" y="208" fill="#59364b" font-size="18" font-family="system-ui,'PingFang SC','Noto Sans SC','Hiragino Sans',sans-serif">PNG · lebih besar · alpha</text>

  <rect x="500" y="120" width="390" height="240" rx="22" fill="#ffe4ee" stroke="#c83f79" stroke-width="3"/>
  <text x="528" y="168" fill="#a13f6c" font-size="24" font-weight="700" font-family="system-ui,'PingFang SC','Noto Sans SC','Hiragino Sans',sans-serif">WebP</text>
  <text x="528" y="208" fill="#59364b" font-size="18" font-family="system-ui,'PingFang SC','Noto Sans SC','Hiragino Sans',sans-serif">WebP · lebih kecil · alpha</text>
<text x="48" y="500" fill="#876579" font-size="18" font-family="system-ui,'PingFang SC','Noto Sans SC','Hiragino Sans',sans-serif">WebP jaga latar tembus. JPG tidak. Formulir lama mungkin masih PNG.</text>
</svg>
