<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" role="img" aria-label="Urutan daftar = urutan halaman">
  <rect width="960" height="540" rx="28" fill="#fff7fb"/>
  <text x="48" y="54" fill="#a13f6c" font-size="32" font-weight="800" font-family="system-ui,'PingFang SC','Noto Sans SC','Hiragino Sans',sans-serif">Urutan daftar = urutan halaman</text>
  <g font-family="system-ui,'PingFang SC','Noto Sans SC','Hiragino Sans',sans-serif" font-size="22" fill="#59364b">
    <rect x="70" y="120" width="360" height="80" rx="16" fill="#ffe4ee" stroke="#c83f79" stroke-width="3"/>
    <text x="100" y="170">1  Cover.pdf</text>
    <rect x="70" y="220" width="360" height="80" rx="16" fill="#fff" stroke="#f2d9e5" stroke-width="3"/>
    <text x="100" y="270">2  Kontrak.pdf</text>
    <rect x="70" y="320" width="360" height="80" rx="16" fill="#fff" stroke="#f2d9e5" stroke-width="3"/>
    <text x="100" y="370">3  Lampiran.pdf</text>
    <text x="500" y="200" fill="#a13f6c" font-size="24" font-weight="700">Seret untuk urutkan</text>
    <text x="500" y="250" font-size="18">Baris pertama = halaman 1.</text>
    <text x="500" y="295" font-size="18">Halaman kosong sumber tetap kosong.</text>
    <text x="500" y="340" font-size="18">Setelah ekspor, hitung halaman.</text>
  </g>
<text x="48" y="500" fill="#876579" font-size="18" font-family="system-ui,'PingFang SC','Noto Sans SC','Hiragino Sans',sans-serif">Halaman 1 salah: daftar salah, bukan unduhan.</text>
</svg>
