<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" role="img" aria-label="Cara putar atau balik foto">
  <rect width="1280" height="720" rx="28" fill="#fff7fb"/>
  <text x="48" y="54" fill="#a13f6c" font-size="32" font-weight="800" font-family="system-ui,'PingFang SC','Noto Sans SC','Hiragino Sans',sans-serif">Cara putar atau balik foto</text>
  <g font-family="system-ui,'PingFang SC','Noto Sans SC','Hiragino Sans',sans-serif">
    <rect x="120" y="150" width="200" height="280" rx="18" fill="#ffe4ee" stroke="#c83f79" stroke-width="4"/>
    <text x="220" y="300" text-anchor="middle" fill="#a13f6c" font-size="22" font-weight="700">90°</text>
    <rect x="420" y="200" width="280" height="180" rx="18" fill="#ffe4ee" stroke="#c83f79" stroke-width="4"/>
    <text x="560" y="305" text-anchor="middle" fill="#a13f6c" font-size="22" font-weight="700">180°</text>
    <rect x="800" y="150" width="200" height="280" rx="18" fill="#fff" stroke="#f7b6cb" stroke-width="4"/>
    <text x="900" y="290" text-anchor="middle" fill="#a13f6c" font-size="20" font-weight="700">Balik = cermin</text>
  </g>
<text x="80" y="520" fill="#876579" font-size="18" font-family="system-ui,'PingFang SC','Noto Sans SC','Hiragino Sans',sans-serif">Putar memutar. Balik cermin. Ekspor menulis piksel.</text>
</svg>
