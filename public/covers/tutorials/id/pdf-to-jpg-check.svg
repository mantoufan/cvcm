<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" role="img" aria-label="Buka satu halaman di 100%">
  <rect width="960" height="540" rx="28" fill="#fff7fb"/>
  <text x="48" y="54" fill="#a13f6c" font-size="32" font-weight="800" font-family="system-ui,'PingFang SC','Noto Sans SC','Hiragino Sans',sans-serif">Buka satu halaman di 100%</text>
  <g font-family="system-ui,'PingFang SC','Noto Sans SC','Hiragino Sans',sans-serif" fill="#59364b" font-size="20">
    <rect x="70" y="130" width="820" height="260" rx="22" fill="#fff" stroke="#f7b6cb" stroke-width="3"/>
    <text x="110" y="200">Zoom 100% dan baca satu baris.</text>
    <text x="110" y="250">Angka di tabel pecah: 2× dan PNG.</text>
    <text x="110" y="300">ZIP semua halaman lebih mudah daripada satu-satu.</text>
  </g>
<text x="48" y="500" fill="#876579" font-size="18" font-family="system-ui,'PingFang SC','Noto Sans SC','Hiragino Sans',sans-serif">Thumbnail bagus, halaman penuh belum tentu.</text>
</svg>
