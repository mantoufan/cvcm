<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" role="img" aria-label="How to convert MP3 to WAV">
  <rect width="1280" height="720" rx="28" fill="#fff7fb"/>
  <text x="48" y="54" fill="#a13f6c" font-size="32" font-weight="800" font-family="system-ui,'PingFang SC','Noto Sans SC','Hiragino Sans',sans-serif">How to convert MP3 to WAV</text>
  <rect x="80" y="140" width="520" height="280" rx="22" fill="#ffffff" stroke="#f2d9e5" stroke-width="3"/>
  <text x="108" y="188" fill="#a13f6c" font-size="24" font-weight="700" font-family="system-ui,'PingFang SC','Noto Sans SC','Hiragino Sans',sans-serif">MP3</text>
  <text x="108" y="228" fill="#59364b" font-size="18" font-family="system-ui,'PingFang SC','Noto Sans SC','Hiragino Sans',sans-serif">MP3 · already lossy</text>

  <rect x="680" y="140" width="520" height="280" rx="22" fill="#ffe4ee" stroke="#c83f79" stroke-width="3"/>
  <text x="708" y="188" fill="#a13f6c" font-size="24" font-weight="700" font-family="system-ui,'PingFang SC','Noto Sans SC','Hiragino Sans',sans-serif">WAV</text>
  <text x="708" y="228" fill="#59364b" font-size="18" font-family="system-ui,'PingFang SC','Noto Sans SC','Hiragino Sans',sans-serif">WAV · uncompressed PCM</text>
<text x="80" y="520" fill="#876579" font-size="18" font-family="system-ui,'PingFang SC','Noto Sans SC','Hiragino Sans',sans-serif">Converting does not restore what MP3 threw away. Play the downloaded WAV.</text>
</svg>
