  <circle cx="370" cy="240" r="170" fill="#ffe4ee" fill-opacity="0.75" stroke="#c83f79" stroke-width="3"/><circle cx="590" cy="240" r="170" fill="#ffe4ee" fill-opacity="0.75" stroke="#c83f79" stroke-width="3"/><text x="285" y="60" fill="#a13f6c" font-size="34" font-weight="800" text-anchor="middle" font-family="system-ui,'PingFang SC','Noto Sans SC','Hiragino Sans',sans-serif">12</text><text x="675" y="60" fill="#a13f6c" font-size="34" font-weight="800" text-anchor="middle" font-family="system-ui,'PingFang SC','Noto Sans SC','Hiragino Sans',sans-serif">18</text><text x="285" y="255" fill="#a13f6c" font-size="44" font-weight="800" text-anchor="middle" font-family="system-ui,'PingFang SC','Noto Sans SC','Hiragino Sans',sans-serif">2</text><text x="675" y="255" fill="#a13f6c" font-size="44" font-weight="800" text-anchor="middle" font-family="system-ui,'PingFang SC','Noto Sans SC','Hiragino Sans',sans-serif">3</text><text x="480" y="225" fill="#c83f79" font-size="40" font-weight="800" text-anchor="middle" font-family="system-ui,'PingFang SC','Noto Sans SC','Hiragino Sans',sans-serif">2</text><text x="480" y="280" fill="#c83f79" font-size="40" font-weight="800" text-anchor="middle" font-family="system-ui,'PingFang SC','Noto Sans SC','Hiragino Sans',sans-serif">3</text><text x="480" y="62" fill="#876579" font-size="20" font-weight="700" text-anchor="middle" font-family="system-ui,'PingFang SC','Noto Sans SC','Hiragino Sans',sans-serif">shared</text><line x1="480" y1="74" x2="480" y2="186" stroke="#876579" stroke-width="2" stroke-linecap="round"/><text x="250" y="475" fill="#c83f79" font-size="28" font-weight="800" text-anchor="middle" font-family="ui-monospace,Menlo,Consolas,monospace">GCF = 2 × 3 = 6</text><text x="690" y="475" fill="#a13f6c" font-size="26" font-weight="800" text-anchor="middle" font-family="ui-monospace,Menlo,Consolas,monospace">LCM = 2 × 2 × 3 × 3 = 36</text>
