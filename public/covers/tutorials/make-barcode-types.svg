<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" role="img" aria-label="Barcode types">
  <rect width="960" height="540" rx="28" fill="#fff7fb"/>
  <text x="48" y="54" fill="#a13f6c" font-size="32" font-weight="800" font-family="system-ui,sans-serif">Pick the symbology first</text>
  <rect x="40" y="100" width="280" height="330" rx="22" fill="#ffe4ee" stroke="#c83f79" stroke-width="3"/>
  <text x="62" y="140" fill="#a13f6c" font-size="22" font-weight="700" font-family="system-ui,sans-serif">Code 128</text>
  <text x="62" y="172" fill="#59364b" font-size="18" font-family="system-ui,sans-serif"><tspan x="62" dy="0">Letters and digits.</tspan><tspan x="62" dy="22">Warehouse, tickets,</tspan><tspan x="62" dy="22">internal IDs.</tspan></text>

  <rect x="340" y="100" width="280" height="330" rx="22" fill="#ffffff" stroke="#f2d9e5" stroke-width="3"/>
  <text x="362" y="140" fill="#a13f6c" font-size="22" font-weight="700" font-family="system-ui,sans-serif">Code 39</text>
  <text x="362" y="172" fill="#59364b" font-size="18" font-family="system-ui,sans-serif"><tspan x="362" dy="0">Older scanners.</tspan><tspan x="362" dy="22">Uppercase, digits,</tspan><tspan x="362" dy="22">a few symbols.</tspan></text>

  <rect x="640" y="100" width="280" height="330" rx="22" fill="#ffffff" stroke="#f2d9e5" stroke-width="3"/>
  <text x="662" y="140" fill="#a13f6c" font-size="22" font-weight="700" font-family="system-ui,sans-serif">EAN-13</text>
  <text x="662" y="172" fill="#59364b" font-size="18" font-family="system-ui,sans-serif"><tspan x="662" dy="0">Retail products.</tspan><tspan x="662" dy="22">12 digits + check.</tspan><tspan x="662" dy="22">Not a URL.</tspan></text>
<text x="48" y="500" fill="#876579" font-size="18" font-family="system-ui,sans-serif">QR codes open links. Barcodes identify a thing. Do not mix them.</text>
</svg>
