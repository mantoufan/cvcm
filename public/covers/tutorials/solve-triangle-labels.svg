<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" role="img" aria-label="Each side is named after the angle opposite it; c is the hypotenuse of a right triangle.">
  <rect width="960" height="540" rx="28" fill="#fff7fb"/>
  <polygon points="220,430 760,430 220,130" fill="#ffe4ee" stroke="#a13f6c" stroke-width="5" stroke-linejoin="round"/><path d="M220 390 L260 390 L260 430" fill="none" stroke="#a13f6c" stroke-width="3"/><text x="196" y="440" fill="#a13f6c" font-size="32" font-weight="800" text-anchor="end" font-family="system-ui,'PingFang SC','Noto Sans SC','Hiragino Sans',sans-serif">C</text><text x="272" y="378" fill="#876579" font-size="20" font-weight="400" text-anchor="start" font-family="system-ui,'PingFang SC','Noto Sans SC','Hiragino Sans',sans-serif">90°</text><text x="780" y="440" fill="#a13f6c" font-size="32" font-weight="800" text-anchor="start" font-family="system-ui,'PingFang SC','Noto Sans SC','Hiragino Sans',sans-serif">A</text><text x="196" y="138" fill="#a13f6c" font-size="32" font-weight="800" text-anchor="end" font-family="system-ui,'PingFang SC','Noto Sans SC','Hiragino Sans',sans-serif">B</text><text x="196" y="290.0" fill="#c83f79" font-size="32" font-weight="800" text-anchor="end" font-family="'Cambria Math','STIX Two Math','Noto Sans Math','Apple Symbols',system-ui,sans-serif">a</text><text x="490.0" y="474" fill="#c83f79" font-size="32" font-weight="800" text-anchor="middle" font-family="'Cambria Math','STIX Two Math','Noto Sans Math','Apple Symbols',system-ui,sans-serif">b</text><text x="518.0" y="264.0" fill="#c83f79" font-size="32" font-weight="800" text-anchor="start" font-family="'Cambria Math','STIX Two Math','Noto Sans Math','Apple Symbols',system-ui,sans-serif">c</text><text x="550.0" y="300.0" fill="#c83f79" font-size="22" font-weight="700" text-anchor="start" font-family="system-ui,'PingFang SC','Noto Sans SC','Hiragino Sans',sans-serif">Hypotenuse</text><text x="560" y="110" fill="#a13f6c" font-size="34" font-weight="800" text-anchor="middle" font-family="'Cambria Math','STIX Two Math','Noto Sans Math','Apple Symbols',system-ui,sans-serif">a² + b² = c²</text><text x="560" y="160" fill="#876579" font-size="22" font-weight="400" text-anchor="middle"