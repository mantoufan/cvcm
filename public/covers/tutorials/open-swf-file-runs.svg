  <rect x="50" y="50" width="600" height="120" rx="14" fill="#ffffff" stroke="#f2d9e5" stroke-width="3"/><rect x="72" y="76" width="54" height="68" rx="8" fill="#ffe4ee" stroke="#c83f79" stroke-width="3"/><text x="99" y="118" fill="#a13f6c" font-size="15" font-weight="700" text-anchor="middle" font-family="ui-monospace,Menlo,Consolas,monospace">SWF</text><text x="146" y="120" fill="#59364b" font-size="24" font-weight="400" text-anchor="start" font-family="system-ui,'PingFang SC','Noto Sans SC','Hiragino Sans',sans-serif">One .swf that starts alone</text><rect x="680" y="50" width="230" height="120" rx="14" fill="#c83f79" stroke="#c83f79" stroke-width="3"/><text x="795" y="122" fill="#fff7fb" font-size="28" font-weight="700" text-anchor="middle" font-family="system-ui,'PingFang SC','Noto Sans SC','Hiragino Sans',sans-serif">Runs</text><rect x="50" y="200" width="600" height="120" rx="14" fill="#ffffff" stroke="#f2d9e5" stroke-width="3"/><rect x="72" y="226" width="54" height="68" rx="8" fill="#ffe4ee" stroke="#c83f79" stroke-width="3"/><text x="99" y="268" fill="#a13f6c" font-size="15" font-weight="700" text-anchor="middle" font-family="ui-monospace,Menlo,Consolas,monospace">SWF</text><text x="146" y="270" fill="#59364b" font-size="24" font-weight="400" text-anchor="start" font-family="system-ui,'PingFang SC','Noto Sans SC','Hiragino Sans',sans-serif">Loads more SWF or XML</text><rect x="680" y="200" width="230" height="120" rx="14" fill="#ffffff" stroke="#876579" stroke-width="3"/><text x="795" y="272" fill="#876579" font-size="28" font-weight="700" text-anchor="middle" font-family="system-ui,'PingFang SC','Noto Sans SC','Hiragino Sans',sans-serif">Stops</text><rect x="50" y="350" width="600" height="120" rx="14" fill="#ffffff" stroke="#f2d9e5" stroke-width="3"/><rect x="72" y="376" width="54" height="68" rx="8" fill="#ffe4ee" stroke="#c83f79" stroke-width="3"/><text x="99" y="418" fill="#a13f6c" font-size="15" font-weight="700" text-anchor="middle" font-family="ui-