<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" role="img" aria-label="Match the limit you actually have">
  <rect width="960" height="540" rx="28" fill="#fff7fb"/>
  <text x="48" y="54" fill="#a13f6c" font-size="28" font-weight="800" font-family="system-ui,'PingFang SC','Noto Sans SC','Hiragino Sans',sans-serif">Match the limit you actually have</text>
  <rect x="50" y="110" width="270" height="300" rx="22" fill="#ffe4ee" stroke="#c83f79" stroke-width="3"/>
  <text x="72" y="150" fill="#a13f6c" font-size="22" font-weight="700" font-family="system-ui,'PingFang SC','Noto Sans SC','Hiragino Sans',sans-serif">Email</text>
  <text x="72" y="182" fill="#59364b" font-size="18" font-family="system-ui,'PingFang SC','Noto Sans SC','Hiragino Sans',sans-serif"><tspan x="72" dy="0">Often 10–25 MB.</tspan><tspan x="72" dy="22">Compress, then</tspan><tspan x="72" dy="22">attach once.</tspan></text>

  <rect x="345" y="110" width="270" height="300" rx="22" fill="#ffffff" stroke="#f2d9e5" stroke-width="3"/>
  <text x="367" y="150" fill="#a13f6c" font-size="22" font-weight="700" font-family="system-ui,'PingFang SC','Noto Sans SC','Hiragino Sans',sans-serif">Form upload</text>
  <text x="367" y="182" fill="#59364b" font-size="18" font-family="system-ui,'PingFang SC','Noto Sans SC','Hiragino Sans',sans-serif"><tspan x="367" dy="0">Read the field.</tspan><tspan x="367" dy="22">Some want 2 MB.</tspan><tspan x="367" dy="22">Some want 20.</tspan></text>

  <rect x="640" y="110" width="270" height="300" rx="22" fill="#ffffff" stroke="#f2d9e5" stroke-width="3"/>
  <text x="662" y="150" fill="#a13f6c" font-size="22" font-weight="700" font-family="system-ui,'PingFang SC','Noto Sans SC','Hiragino Sans',sans-serif">Too blurry</text>
  <text x="662" y="182" fill="#59364b" font-size="18" font-family="system-ui,'PingFang SC','Noto Sans SC','Hiragino Sans',sans-serif"><tspan x="662" dy="0">Use less JPEG</tspan><tspan x="662" dy="22">quality loss.</tspan><tspan x="662" dy="22">Or split the PDF.</tspan></text>
<text x="48" y="500" fill="#876579" font-size="18" font-family="system-ui,'PingFang SC','Noto Sans SC','Hiragino Sans',sans-serif">A smaller file that nobody can read is not a success.</text>
</svg>
