<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" role="img" aria-label="How to compress a PDF">
  <rect width="1280" height="720" rx="28" fill="#fff7fb"/>
  <text x="48" y="54" fill="#a13f6c" font-size="32" font-weight="800" font-family="system-ui,'PingFang SC','Noto Sans SC','Hiragino Sans',sans-serif">How to compress a PDF</text>
  <g font-family="system-ui,'PingFang SC','Noto Sans SC','Hiragino Sans',sans-serif">
    <rect x="100" y="180" width="280" height="320" rx="20" fill="#fff" stroke="#f7b6cb" stroke-width="4"/>
    <text x="130" y="250" fill="#a13f6c" font-size="26" font-weight="700">24.1 MB</text>
    <text x="130" y="300" fill="#876579" font-size="18">email limit 10 MB</text>
    <path d="M430 330 h90" stroke="#c83f79" stroke-width="10" stroke-linecap="round"/>
    <polygon points="520,310 580,330 520,350" fill="#c83f79"/>
    <rect x="620" y="180" width="280" height="320" rx="20" fill="#ffe4ee" stroke="#c83f79" stroke-width="4"/>
    <text x="650" y="250" fill="#a13f6c" font-size="26" font-weight="700">6.4 MB</text>
    <text x="650" y="300" fill="#59364b" font-size="18">pages still readable</text>
  </g>
<text x="100" y="620" fill="#876579" font-size="18" font-family="system-ui,'PingFang SC','Noto Sans SC','Hiragino Sans',sans-serif">Compression re-encodes pages. Open a photo-heavy page after export.</text>
</svg>
