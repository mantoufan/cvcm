<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" role="img" aria-label="Thứ tự danh sách là thứ tự trang">
  <rect width="960" height="540" rx="28" fill="#fff7fb"/>
  <text x="48" y="54" fill="#a13f6c" font-size="32" font-weight="800" font-family="system-ui,'PingFang SC','Noto Sans SC','Hiragino Sans',sans-serif">Thứ tự danh sách là thứ tự trang</text>
  <g font-family="system-ui,'PingFang SC','Noto Sans SC','Hiragino Sans',sans-serif" font-size="22" fill="#59364b">
    <rect x="70" y="120" width="360" height="80" rx="16" fill="#ffe4ee" stroke="#c83f79" stroke-width="3"/>
    <text x="100" y="170">1  Bia.pdf</text>
    <rect x="70" y="220" width="360" height="80" rx="16" fill="#fff" stroke="#f2d9e5" stroke-width="3"/>
    <text x="100" y="270">2  HopDong.pdf</text>
    <rect x="70" y="320" width="360" height="80" rx="16" fill="#fff" stroke="#f2d9e5" stroke-width="3"/>
    <text x="100" y="370">3  PhuLuc.pdf</text>
    <text x="500" y="200" fill="#a13f6c" font-size="24" font-weight="700">Kéo để sắp xếp</text>
    <text x="500" y="250" font-size="18">Hàng đầu là trang 1.</text>
    <text x="500" y="295" font-size="18">Trang trống trong nguồn vẫn trống.</text>
    <text x="500" y="340" font-size="18">Xuất xong hãy đếm trang.</text>
  </g>
<text x="48" y="500" fill="#876579" font-size="18" font-family="system-ui,'PingFang SC','Noto Sans SC','Hiragino Sans',sans-serif">Trang 1 sai thì do danh sách, không phải file tải.</text>
</svg>
