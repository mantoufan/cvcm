<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" role="img" aria-label="Cách chú thích ảnh chụp màn hình">
  <rect width="1280" height="720" rx="28" fill="#fff7fb"/>
  <text x="48" y="54" fill="#a13f6c" font-size="32" font-weight="800" font-family="system-ui,'PingFang SC','Noto Sans SC','Hiragino Sans',sans-serif">Cách chú thích ảnh chụp màn hình</text>
  <g font-family="system-ui,'PingFang SC','Noto Sans SC','Hiragino Sans',sans-serif">
    <rect x="140" y="140" width="320" height="240" rx="20" fill="#fff" stroke="#c83f79" stroke-width="5"/>
    <text x="300" y="275" text-anchor="middle" fill="#a13f6c" font-size="22">Khung</text>
    <line x1="520" y1="200" x2="720" y2="320" stroke="#c83f79" stroke-width="8" stroke-linecap="round"/>
    <polygon points="720,320 680,300 700,270" fill="#c83f79"/>
    <text x="620" y="420" text-anchor="middle" fill="#a13f6c" font-size="20">Mũi tên</text>
    <text x="920" y="280" text-anchor="middle" fill="#a13f6c" font-size="28" font-weight="800">Hai từ</text>
  </g>
<text x="80" y="520" fill="#876579" font-size="18" font-family="system-ui,'PingFang SC','Noto Sans SC','Hiragino Sans',sans-serif">Điều khiển hỏng thì khung. Chỗ bấm thì mũi tên. Xem cỡ chat.</text>
</svg>
