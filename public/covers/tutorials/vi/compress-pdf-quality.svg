<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" role="img" aria-label="So dung lượng với trang thật">
  <rect width="960" height="540" rx="28" fill="#fff7fb"/>
  <text x="48" y="54" fill="#a13f6c" font-size="28" font-weight="800" font-family="system-ui,'PingFang SC','Noto Sans SC','Hiragino Sans',sans-serif">So dung lượng với trang thật</text>
  <g font-family="system-ui,'PingFang SC','Noto Sans SC','Hiragino Sans',sans-serif">
    <rect x="70" y="130" width="380" height="260" rx="20" fill="#fff" stroke="#f2d9e5" stroke-width="3"/>
    <text x="100" y="190" fill="#876579" font-size="18">Nén mạnh hơn</text>
    <text x="100" y="250" fill="#a13f6c" font-size="40" font-weight="700">2.1 MB</text>
