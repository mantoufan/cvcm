  <text x="98" y="218" fill="#59364b" font-size="18" font-family="system-ui,'PingFang SC','Noto Sans SC','Hiragino Sans',sans-serif">Mở file. Ảnh chỉ lệch vì EXIF sẽ đứng thật.</text>
