<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" role="img" aria-label="Cách đổi dấu thời gian Unix">
  <rect width="1280" height="720" rx="28" fill="#fff7fb"/>
  <text x="48" y="54" fill="#a13f6c" font-size="28" font-weight="800" font-family="system-ui,'PingFang SC','Noto Sans SC','Hiragino Sans',sans-serif">Cách đổi dấu thời gian Unix</text>
  <rect x="80" y="140" width="340" height="240" rx="22" fill="#ffffff" stroke="#f2d9e5" stroke-width="3"/>
  <text x="108" y="192" fill="#a13f6c" font-size="24" font-weight="700" font-family="system-ui,'PingFang SC','Noto Sans SC','Hiragino Sans',sans-serif">10 chữ số</text>
  <text x="108" y="236" fill="#59364b" font-size="18" font-family="system-ui,'PingFang SC','Noto Sans SC','Hiragino Sans',sans-serif">giây</text>

  <rect x="460" y="140" width="340" height="240" rx="22" fill="#ffffff" stroke="#f2d9e5" stroke-width="3"/>
  <text x="488" y="192" fill="#a13f6c" font-size="24" font-weight="700" font-family="system-ui,'PingFang SC','Noto Sans SC','Hiragino Sans',sans-serif">13 chữ số</text>
  <text x="488" y="236" fill="#59364b" font-size="18" font-family="system-ui,'PingFang SC','Noto Sans SC','Hiragino Sans',sans-serif">mili giây</text>

  <rect x="840" y="140" width="360" height="240" rx="22" fill="#ffe4ee" stroke="#c83f79" stroke-width="3"/>
  <text x="868" y="192" fill="#a13f6c" font-size="24" font-weight="700" font-family="system-ui,'PingFang SC','Noto Sans SC','Hiragino Sans',sans-serif">16 chữ số</text>
  <text x="868" y="236" fill="#59364b" font-size="18" font-family="system-ui,'PingFang SC','Noto Sans SC','Hiragino Sans',sans-serif">chia 1.000 một lần</text>
<text x="80" y="480" fill="#876579" font-size="18" font-family="system-ui,'PingFang SC','Noto Sans SC','Hiragino Sans',sans-serif">Đọc ISO và giờ máy. Năm kỳ lạ là đếm sai chữ số.</text>
</svg>
