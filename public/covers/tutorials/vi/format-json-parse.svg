  <text x="48" y="54" fill="#a13f6c" font-size="22" font-weight="800" font-family="system-ui,'PingFang SC','Noto Sans SC','Hiragino Sans',sans-serif">Để đọc thì giãn. Để gửi thì một dòng. Cả hai phải phân tích được.</text>
  <rect x="70" y="140" width="820" height="200" rx="22" fill="#ffe4ee" stroke="#c83f79" stroke-width="3"/>
