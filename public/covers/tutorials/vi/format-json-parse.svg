  <text x="98" y="236" fill="#59364b" font-size="18" font-family="system-ui,'PingFang SC','Noto Sans SC','Hiragino Sans',sans-serif">Để đọc thì giãn. Để gửi thì một dòng. Cả hai phải phân tích được.</text>
<text x="48" y="500" fill="#876579" font-size="18" font-family="system-ui,'PingFang SC','Noto Sans SC','Hiragino Sans',sans-serif">Để đọc thì giãn. Để gửi thì một dòng. Cả hai phải phân tích được.</text>
