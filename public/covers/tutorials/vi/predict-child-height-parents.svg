<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" role="img" aria-label="Công thức trung bình bố mẹ cho con trai và con gái.">
  <rect width="960" height="540" rx="28" fill="#fff7fb"/>
  <rect x="60" y="70" width="840" height="170" rx="24" fill="#ffffff" stroke="#f2d9e5" stroke-width="3"/><text x="100" y="120" fill="#4a6fc8" font-size="28" font-weight="800" text-anchor="start" font-family="system-ui,'PingFang SC','Noto Sans SC','Hiragino Sans',sans-serif">Con trai</text><text x="480" y="180" fill="#59364b" font-size="32" font-weight="800" text-anchor="middle" font-family="system-ui,'PingFang SC','Noto Sans SC','Hiragino Sans',sans-serif">(Bố + Mẹ + 13 cm) ÷ 2</text><rect x="60" y="290" width="840" height="170" rx="24" fill="#ffffff" stroke="#f2d9e5" stroke-width="3"/><text x="100" y="340" fill="#c83f79" font-size="28" font-weight="800" text-anchor="start" font-family="system-ui,'PingFang SC','Noto Sans SC','Hiragino Sans',sans-serif">Con gái</text><text x="480" y="400" fill="#59364b" font-size="32" font-weight="800" text-anchor="middle" font-family="system-ui,'PingFang SC','Noto Sans SC','Hiragino Sans',sans-serif">(Bố + Mẹ − 13 cm) ÷ 2</text><text x="480" y="520" fill="#a13f6c" font-size="26" font-weight="800" text-anchor="middle" font-family="system-ui,'PingFang SC','Noto Sans SC','Hiragino Sans',sans-serif">± 8,5 cm</text>
