<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" role="img" aria-label="Đi một vòng bốn cạnh">
  <rect width="960" height="540" rx="28" fill="#fff7fb"/>
  <text x="48" y="54" fill="#a13f6c" font-size="32" font-weight="800" font-family="system-ui,'PingFang SC','Noto Sans SC','Hiragino Sans',sans-serif">Đi một vòng bốn cạnh</text>
  <rect x="310" y="90" width="340" height="300" rx="16" fill="#ffe4ee" stroke="#c83f79" stroke-width="6"/>
  <circle cx="480" cy="185" r="32" fill="#c83f79"/>
  <ellipse cx="480" cy="290" rx="70" ry="78" fill="#c83f79"/>
  <g font-family="system-ui,'PingFang SC','Noto Sans SC','Hiragino Sans',sans-serif" fill="#a13f6c" font-size="20" font-weight="700">
    <text x="70" y="140">Trên đầu</text>
    <text x="70" y="170" fill="#59364b" font-size="16" font-weight="400">Đừng cắt sọ.</text>
    <text x="680" y="180">Hướng nhìn</text>
    <text x="680" y="210" fill="#59364b" font-size="16" font-weight="400">Nhìn đâu thì chừa chỗ đó.</text>
    <text x="70" y="360">Khớp</text>
    <text x="70" y="390" fill="#59364b" font-size="16" font-weight="400">Đừng cắt cổ tay, đầu gối.</text>
    <text x="680" y="360">Cạnh</text>
    <text x="680" y="390" fill="#59364b" font-size="16" font-weight="400">Đừng để nửa đồ vật dính mép.</text>
  </g>
<text x="48" y="500" fill="#876579" font-size="18" font-family="system-ui,'PingFang SC','Noto Sans SC','Hiragino Sans',sans-serif">Xuất, mở lại, xem 100%. Ô cắt rất nhỏ.</text>
</svg>
