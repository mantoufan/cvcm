  <text x="60" y="380" fill="#59364b" font-size="20" font-family="system-ui,'PingFang SC','Noto Sans SC','Hiragino Sans',sans-serif">Nhập 12 số. Công cụ thêm số kiểm. Cửa hàng từ chối thì sai kiểm hoặc tiền tố không phải của bạn.</text>
