<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" role="img" aria-label="Kiểm tra file đã gộp">
  <rect width="960" height="540" rx="28" fill="#fff7fb"/>
  <text x="48" y="54" fill="#a13f6c" font-size="32" font-weight="800" font-family="system-ui,'PingFang SC','Noto Sans SC','Hiragino Sans',sans-serif">Kiểm tra file đã gộp</text>
  <g font-family="system-ui,'PingFang SC','Noto Sans SC','Hiragino Sans',sans-serif">
    <rect x="80" y="130" width="800" height="280" rx="24" fill="#fff" stroke="#f7b6cb" stroke-width="3"/>
    <text x="120" y="200" fill="#a13f6c" font-size="26" font-weight="700">Mở file đã tải</text>
    <text x="120" y="255" fill="#59364b" font-size="20">3 + 2 + 4 phải thành 9 trang.</text>
    <text x="120" y="305" fill="#59364b" font-size="20">Xem trang đầu mỗi khối gốc.</text>
    <text x="120" y="355" fill="#59364b" font-size="20">Thiếu file thì bị khóa hoặc chưa thêm.</text>
  </g>
<text x="48" y="500" fill="#876579" font-size="18" font-family="system-ui,'PingFang SC','Noto Sans SC','Hiragino Sans',sans-serif">Mở một lần rồi mới gửi.</text>
</svg>
